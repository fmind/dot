# Docs: https://vale.sh/docs/vale-ini
StylesPath = dot_config/vale/styles
MinAlertLevel = warning
IgnoredScopes = code, tt
SkippedScopes = script, style, pre, figure

[*.{md,mdx,txt,html}]
BasedOnStyles = Fmind

[*.html]
Fmind.ProseBackticks = NO

# Repository README lists literal CLI commands and keybindings across dense reference bullets.
[{README.md,**/README.md}]
Fmind.ProseBackticks = NO
Fmind.ParagraphLength = NO
Fmind.SentenceLength = NO

# Internal agent instructions and skill references legitimately use inline code for flags and paths.
[{AGENTS.md,**/AGENTS.md,dot_agents/**,skills/**/SKILL.md,skills/**/references/**,skills/skillify/templates/**,skills/subagent/templates/**,.github/**}]
Fmind.EmDash = NO
Fmind.ProseBackticks = NO
Fmind.ParagraphLength = NO
Fmind.SentenceLength = NO
