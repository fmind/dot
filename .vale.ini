# Docs: https://vale.sh/docs/vale-ini
StylesPath = dot_config/vale/styles
MinAlertLevel = warning
IgnoredScopes = code, tt
SkippedScopes = script, style, pre, figure

[formats]
typ = txt

[*.{md,mdx,txt,html,htm}]
BasedOnStyles = Fmind

# Typst decks map prose to plain text; skip length counters that treat #slide(...) blocks as one sentence.
[*.typ]
BasedOnStyles = Fmind
Fmind.ParagraphLength = NO
Fmind.SentenceLength = NO

# Repository docs list literal CLI commands and keybindings across dense reference bullets.
[{README.md,**/README.md,CHANGELOG.md,**/CHANGELOG.md}]
Fmind.ParagraphLength = NO
Fmind.SentenceLength = NO

# Internal agent instructions and skill references legitimately use inline code and em dashes.
[{dot_agents/**,**/dot_agents/**,.agents/**,**/.agents/**,skills/**/SKILL.md,**/skills/**/SKILL.md,skills/**/references/**,**/skills/**/references/**,skills/skillify/templates/**,**/skills/skillify/templates/**,skills/subagent/templates/**,**/skills/subagent/templates/**,.github/**,**/.github/**}]
Fmind.EmDash = NO
Fmind.ParagraphLength = NO
Fmind.SentenceLength = NO

# Enforce no em dashes in AGENTS.md files (including dot_agents/AGENTS.md) while allowing dense reference lists.
[{AGENTS.md,**/AGENTS.md}]
Fmind.EmDash = YES
Fmind.ParagraphLength = NO
Fmind.SentenceLength = NO

# External starter templates nested under skills/**/references/** must keep full prose rules.
[{skills/docs/references/repository/templates/README.md,**/skills/docs/references/repository/templates/README.md}]
Fmind.EmDash = YES

[{skills/docs/references/site/templates/**,**/skills/docs/references/site/templates/**,skills/python/references/foundation/templates/docs-index.md,**/skills/python/references/foundation/templates/docs-index.md}]
Fmind.EmDash = YES
Fmind.ParagraphLength = YES
Fmind.SentenceLength = YES

# Skip vendored dependencies, generated host subagent copies, and third-party license texts.
[{.venv/**,**/.venv/**,node_modules/**,**/node_modules/**,private_dot_gemini/**,**/private_dot_gemini/**,private_dot_copilot/**,**/private_dot_copilot/**,LICENSE,LICENSE.*,**/LICENSE,**/LICENSE.*}]
Fmind = NO
