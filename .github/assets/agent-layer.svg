<g text-anchor="middle">
<rect class="tile" x="600" y="396" width="328" height="56" rx="10"/><text class="code tile-title" x="764" y="420">dot agent session sync</text><text class="muted" x="764" y="440">a local archive of every harness</text>
<line class="flow" x1="596" y1="424" x2="396" y2="424" marker-end="url(#arrow)"/><text class="code muted" x="496" y="414">dot agent stats</text>
<rect class="tile" x="32" y="396" width="360" height="56" rx="10"/><text class="tile-title" x="212" y="420">Usage reports</text><text class="muted" x="212" y="440">tokens · API value · actual costs</text>
</g>
</svg>
