<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
<title id="title">Three credential paths, nothing exported at shell startup</title>
<desc id="desc">Shell startup exports no secrets. Logins are interactive and each tool keeps its own tokens: dot login google covers Workspace, then GCP and ADC; dot login github and dot login colab cover the rest, and each agent harness has its own login. Encrypted seeds are age-encrypted sources committed to Git that only the owner's key decrypts; chezmoi apply decrypts them with that key into the native Hugging Face, Kaggle and OpenCode credential files, created only when absent so later logins survive apply; without the key, apply skips them. Scoped keys reach one command at a time: dot secret run NAME -- cmd uses an existing environment value first, then ~/.config/dot/secrets/NAME, and an empty value fails closed; dot secret publish handles PyPI uploads. For customer work, select accounts explicitly; scoped keys never retry with personal credentials.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 L10 5 L0 10 Z"/></marker>
<style>
text { font-family: "Google Sans", "Google Sans Text", Roboto, "Segoe UI", Helvetica, Arial, sans-serif; fill: #202124; }
.code { font-family: "Google Sans Code", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
.card { fill: #FFFFFF; stroke: #DADCE0; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #595D62; }
.chip { fill: #F1F3F4; }
.chip-text { font-size: 13px; }
.muted { font-size: 12.5px; fill: #595D62; }
.box { fill: #FFFFFF; stroke: #174EA6; stroke-width: 2; }
.tile { fill: #D2E3FC; }
.tile-title { font-size: 14px; font-weight: 700; fill: #174EA6; }
.config { fill: #FEEFC3; stroke: #E37400; }
.ok { fill: #CEEAD6; }
.ok-text { font-size: 14px; font-weight: 700; fill: #0D652D; }
.err { fill: #FAD2CF; }
.err-text { font-size: 13px; font-weight: 700; fill: #A50E0E; }
.flow { fill: none; stroke: #174EA6; stroke-width: 2; }
.arrowhead { fill: #174EA6; }
.check { fill: none; stroke: #0D652D; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
</style>
</defs>
<rect class="card" x="1" y="1" width="958" height="458" rx="16"/>

<!-- Invariant -->
<rect class="ok" x="300" y="18" width="360" height="34" rx="17"/>
<path class="check" d="M366 35 l5 5 l10 -10"/>
<text class="ok-text" x="390" y="40">Shell startup exports no secrets</text>

<!-- Logins -->
<rect class="box" x="24" y="68" width="296" height="320" rx="14"/>
<g text-anchor="middle">
<text class="label" x="172" y="96">LOGINS</text>
<text class="muted" x="172" y="116">interactive · each tool keeps its tokens</text>
<rect class="tile" x="44" y="132" width="256" height="58" rx="10"/><text class="code tile-title" x="172" y="156">dot login google</text><text class="muted" x="172" y="176">Workspace, then GCP and ADC</text>
<rect class="chip" x="44" y="204" width="256" height="34" rx="17"/><text class="code chip-text" x="172" y="226">dot login github</text>
<rect class="chip" x="44" y="246" width="256" height="34" rx="17"/><text class="code chip-text" x="172" y="268">dot login colab</text>
<rect class="chip" x="44" y="288" width="256" height="34" rx="17"/><text class="chip-text" x="172" y="310">One login per agent harness</text>
<text class="muted" x="172" y="362">stored by gh, gcloud and each harness</text>
</g>

<!-- Encrypted seeds -->
<rect class="box" x="332" y="68" width="296" height="320" rx="14"/>
<g text-anchor="middle">
<text class="label" x="480" y="96">ENCRYPTED SEEDS</text>
<text class="muted" x="480" y="116">age in Git · created only when absent</text>
<rect class="config" x="352" y="132" width="256" height="58" rx="10"/><text class="code" x="480" y="156" style="font-size:14px;font-weight:700">*.age</text><text class="muted" x="480" y="176">committed · owner's key only</text>
<rect class="tile" x="352" y="246" width="256" height="58" rx="10"/><text class="tile-title" x="480" y="270">Hugging Face · Kaggle · OpenCode</text><text class="muted" x="480" y="290">native credential files</text>
<text class="muted" x="480" y="342">later logins survive apply</text>
<text class="muted" x="480" y="362">without the key, apply skips them</text>
</g>
<line class="flow" x1="480" y1="194" x2="480" y2="240" marker-end="url(#arrow)"/>
<text class="code muted" x="492" y="215">chezmoi apply</text>
<text class="muted" x="492" y="232">+ that age key</text>

<!-- Scoped keys -->
<rect class="box" x="640" y="68" width="296" height="320" rx="14"/>
<g text-anchor="middle">
<text class="label" x="788" y="96">SCOPED KEYS</text>
<text class="muted" x="788" y="116">one command at a time</text>
<rect class="tile" x="660" y="132" width="256" height="58" rx="10"/><text class="code tile-title" x="788" y="156">dot secret run NAME -- cmd</text><text class="muted" x="788" y="176">only that command gets the key</text>
<rect class="chip" x="660" y="204" width="256" height="34" rx="17"/><text class="chip-text" x="788" y="226">1 · existing environment value</text>
<rect class="chip" x="660" y="246" width="256" height="34" rx="17"/><text class="chip-text" x="788" y="268">2 · <tspan class="code">~/.config/dot/secrets/NAME</tspan></text>
<rect class="err" x="660" y="288" width="256" height="34" rx="17"/><text class="err-text" x="788" y="310">An empty value fails closed</text>
<text class="muted" x="788" y="362"><tspan class="code">dot secret publish</tspan> · PyPI uploads</text>
</g>

<!-- Customer work -->
<rect class="chip" x="120" y="404" width="720" height="36" rx="18"/>
<text x="480" y="427" text-anchor="middle" style="font-size:13.5px"><tspan style="font-weight:700">Customer work:</tspan> select accounts explicitly; scoped keys never retry with personal credentials.</text>
</svg>
