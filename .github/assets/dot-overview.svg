<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">How dot works</title>
<desc id="desc">This repository holds dotfiles and templates, the agent persona, skills and roles, the tool baseline and lockfile, encrypted credentials, the pinned theme and fonts, the dot CLI and its tasks, and CI. Cloning it and running install.sh installs mise and chezmoi, then the locked tools. chezmoi applies files, hooks and encrypted seeds; mise installs locked tools and runs tasks and checks; the dot CLI checks health, handles logins and secrets and reports agent usage. The result is a Linux or macOS workstation in user space with Ghostty, Zellij, Fish, Starship, Atuin, zoxide, Neovim with LazyVim, Python with uv, Ruff and ty, cloud and infrastructure CLIs, six agent harnesses and health and usage reports. Changes go back into the source, never the deployed copy: preview the diff, then apply.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 L10 5 L0 10 Z"/></marker>
<style>
text { font-family: "Google Sans", "Google Sans Text", Roboto, "Segoe UI", Helvetica, Arial, sans-serif; fill: #202124; }
.code { font-family: "Google Sans Code", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
.card { fill: #FFFFFF; stroke: #DADCE0; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #595D62; }
.chip { fill: #F1F3F4; }
.chip-text { font-size: 14px; }
.muted { font-size: 12.5px; fill: #595D62; }
.box { fill: #FFFFFF; stroke: #174EA6; stroke-width: 2; }
.tile { fill: #D2E3FC; }
.tile-title { font-size: 15px; font-weight: 700; fill: #174EA6; }
.config { fill: #FEEFC3; stroke: #E37400; }
.step { fill: #174EA6; }
.step-text { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
.flow { fill: none; stroke: #174EA6; stroke-width: 2; }
.arrowhead { fill: #174EA6; }
.mask { fill: #FFFFFF; }
</style>
</defs>
<rect class="card" x="1" y="1" width="958" height="478" rx="16"/>

<!-- Repository -->
