<g text-anchor="middle">
<rect class="chip" x="32" y="64" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="86">Dotfiles · templates</text>
<rect class="chip" x="32" y="106" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="128">Persona · skills · roles</text>
<rect class="chip" x="32" y="148" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="170">Tool baseline · lockfile</text>
<rect class="chip" x="32" y="190" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="212">Encrypted credentials</text>
<rect class="chip" x="32" y="232" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="254">Pinned theme · fonts</text>
<rect class="chip" x="32" y="274" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="296">dot CLI · repository tasks</text>
<rect class="chip" x="32" y="316" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="338">CI · releases · audits</text>
</g>

<!-- 1 Clone -->
<line class="flow" x1="262" y1="207" x2="314" y2="207" marker-end="url(#arrow)"/>
<circle class="step" cx="288" cy="183" r="11"/><text class="step-text" x="288" y="187.5" text-anchor="middle">1</text>
<text class="muted" x="288" y="233" text-anchor="middle">clone</text>

<!-- Engines -->
<text class="label" x="480" y="44" text-anchor="middle">CHEZMOI · MISE · DOT</text>
<rect class="box" x="320" y="60" width="320" height="316" rx="14"/>
<g text-anchor="middle">
<rect class="config" x="340" y="78" width="280" height="56" rx="10"/>
<text class="code" x="480" y="101" style="font-size:15px;font-weight:700">install.sh</text>
<text class="muted" x="480" y="122">mise · chezmoi init · mise run install</text>
<rect class="tile" x="340" y="148" width="280" height="54" rx="10"/><text class="code tile-title" x="480" y="170">chezmoi</text><text class="muted" x="480" y="190">files · hooks · encrypted seeds</text>
<rect class="tile" x="340" y="212" width="280" height="54" rx="10"/><text class="code tile-title" x="480" y="234">mise</text><text class="muted" x="480" y="254">locked tools · tasks · checks</text>
<rect class="tile" x="340" y="276" width="280" height="54" rx="10"/><text class="code tile-title" x="480" y="298">dot</text><text class="muted" x="480" y="318">doctor · logins · secrets · usage</text>
<text class="muted" x="480" y="358">re-sync anytime: <tspan class="code">mise run full</tspan></text>
</g>

<!-- 2 Apply -->
<line class="flow" x1="644" y1="207" x2="700" y2="207" marker-end="url(#arrow)"/>
<circle class="step" cx="672" cy="183" r="11"/><text class="step-text" x="672" y="187.5" text-anchor="middle">2</text>
