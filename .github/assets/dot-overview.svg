<rect class="chip" x="704" y="106" width="224" height="34" rx="17"/><text class="chip-text" x="816" y="128">Starship · Atuin · zoxide</text>
<rect class="chip" x="704" y="148" width="224" height="34" rx="17"/><text class="chip-text" x="816" y="170">Neovim · LazyVim</text>
<rect class="chip" x="704" y="190" width="224" height="34" rx="17"/><text class="chip-text" x="816" y="212">Python · uv · Ruff · ty</text>
<rect class="chip" x="704" y="232" width="224" height="34" rx="17"/><text class="chip-text" x="816" y="254">Cloud · infra CLIs</text>
<rect class="chip" x="704" y="274" width="224" height="34" rx="17"/><text class="chip-text" x="816" y="296">Six agent harnesses</text>
<rect class="chip" x="704" y="316" width="224" height="34" rx="17"/><text class="chip-text" x="816" y="338">Health · usage reports</text>
</g>
<text class="muted" x="816" y="374" text-anchor="middle">Linux · macOS · user space</text>

<!-- 3 Change -->
<path class="flow" d="M816 388 V440 H144 V356" marker-end="url(#arrow)"/>
<rect class="mask" x="246" y="428" width="468" height="24"/>
<circle class="step" cx="262" cy="440" r="11"/><text class="step-text" x="262" y="444.5" text-anchor="middle">3</text>
<text x="282" y="445" style="font-size:14px">change the source, never the deployed copy: diff, then apply</text>
