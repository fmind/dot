# Docs: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
# Security updates only: `open-pull-requests-limit: 0` disables version updates, while
# Dependabot still opens one grouped fix PR per ecosystem when an alert has a patched
# release. `schedule` is required by the schema; it only paces the disabled version updates.
# upgrade-tools refreshes everything else, including the pins in the shipped templates and
# the digest-pinned Docker base image, which the GitHub Advisory Database does not cover.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows; any other directory is scanned for *.yml files,
    # which covers the SHA-pinned workflow templates shipped in skills.
    directories:
      - /
      - /skills/cloud-run/templates
      - /skills/documentation-site/templates
      - /skills/github-actions/references/ci-cd/templates
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /dot
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
