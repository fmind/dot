# Docs: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
# Security updates only: `open-pull-requests-limit: 0` disables version updates, while
# Dependabot still opens one grouped fix PR per ecosystem when an alert has a patched
# release. `schedule` is required by the schema; it only paces the disabled version updates.
# Security updates need an alert, and alerts follow the dependency graph, which lists only
# .github/workflows for Actions: upgrade-tools refreshes the pins in the shipped skill
# templates and the digest-pinned Docker base image, which the Advisory Database does not cover.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /dot
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
