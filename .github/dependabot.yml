# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows; any other directory is scanned for *.yml files,
    # which keeps the SHA-pinned workflow templates shipped in skills current.
    directories:
      - /
      - /skills/cloud-run/templates
      - /skills/documentation-site/templates
      - /skills/github-actions/references/ci-cd/templates
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    # Keeps the digest-pinned base images in the shipped Dockerfile template current.
    directory: /skills/containerize/templates
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      images:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: uv
    directory: /dot
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
