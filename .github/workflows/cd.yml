# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CD
on:
  push:
    tags:
      - "v*"
permissions: {}
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  # A tag can point at a commit whose CI is still running or red: rerun the full
  # Linux and macOS CI workflow on the tagged commit before extracting notes.
  ci:
    name: Gate release
    # A tag-triggered workflow already pins the caller's exact tag commit.
    # jactionlint ignore=self-repository
    uses: ./.github/workflows/ci.yml
    with:
      cache: "false"
    permissions:
      contents: read
  notes:
    name: Extract release notes
    needs: ci
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff derives the release notes from the complete tag history.
          fetch-depth: 0
          persist-credentials: false
      - name: Install git-cliff
        # jactionlint ignore=self-repository
        uses: ./.github/actions/setup-mise
        with:
          tools: git-cliff
          cache: false
      - name: Extract release notes
        id: notes
        run: |
          # Match the previous release commit directly so retired tags never widen the range.
          prev_release="$(git log -n 1 --basic-regexp --grep='^chore(release): v' --format=%H HEAD^)"
          delimiter="EOF_$(cat /proc/sys/kernel/random/uuid)"
          {
            printf 'notes<<%s\n' "$delimiter"
            git-cliff --config dot_config/git-cliff/cliff.toml --strip all --tag "$GITHUB_REF_NAME" "${prev_release:+${prev_release}..}HEAD"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
  # The write token lives in a job that checks out and runs no repository code.
  publish:
    name: Publish GitHub release
    needs: notes
    runs-on: ubuntu-26.04
    permissions:
      contents: write # Create the release for the gated tag.
    timeout-minutes: 10
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.notes.outputs.notes }}
        run: printf '%s\n' "$NOTES" | gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file -
