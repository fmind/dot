name: CD
# Triggered when an annotated release tag (v*) is pushed to origin.
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    # Only this job creates the release, so the write scope stops here.
    permissions:
      actions: read
      contents: write
    timeout-minutes: 25
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful CI for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-exact-sha.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
