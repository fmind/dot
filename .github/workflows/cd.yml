# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CD
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # A tag can point at a commit whose CI is still running or red: rerun the gate
  # with a read-only token so a regression blocks the release instead of shipping.
  gate:
    name: Gate release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff derives the release notes from the complete tag history.
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          # Match the tested bootstrap baseline and revision-3 lockfile reader.
          version: 2026.10.2
      - name: Run canonical gate
        run: mise run all
      - name: Verify clean tree
        run: |
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test -z "$status"
      - name: Extract release notes
        id: notes
        run: |
          {
            echo "notes<<EOF_RELEASE_NOTES"
            git-cliff --config dot_config/git-cliff/cliff.toml --latest --strip all
            echo "EOF_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"
  # The write token lives in a job that checks out and runs no repository code.
  publish:
    name: Publish GitHub release
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Create the release for the gated tag.
    timeout-minutes: 10
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.gate.outputs.notes }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes "$NOTES"
