# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CD
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  # A tag can point at a commit whose CI is still running or red: rerun the gate
  # with a read-only token so a regression blocks the release instead of shipping.
  gate:
    name: Gate release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff derives the release notes from the complete tag history.
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false
          version: 2026.11.8
      - name: Run canonical gate
        run: mise run all
      - name: Verify clean tree
        run: git status --short && [ -z "$(git status --porcelain)" ]
      - name: Extract release notes
        id: notes
        run: |
          # Match the previous release commit directly so retired tags never widen the range.
          prev_release="$(git log -n 1 --basic-regexp --grep='^chore(release): v' --format=%H HEAD^)"
          delimiter="EOF_$(cat /proc/sys/kernel/random/uuid)"
          {
            printf 'notes<<%s\n' "$delimiter"
            git-cliff --config dot_config/git-cliff/cliff.toml --strip all --tag "$GITHUB_REF_NAME" "${prev_release:+${prev_release}..}HEAD"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
  # The write token lives in a job that checks out and runs no repository code.
  publish:
    name: Publish GitHub release
    needs: gate
    runs-on: ubuntu-26.04
    permissions:
      contents: write # Create the release for the gated tag.
    timeout-minutes: 10
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.gate.outputs.notes }}
        run: printf '%s\n' "$NOTES" | gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file -
