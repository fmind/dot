# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Security
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security
  cancel-in-progress: true
jobs:
  scan:
    name: Full-history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: true
          # Match the tested bootstrap baseline and revision-3 lockfile reader.
          version: 2026.10.18
      - name: Scan complete Git history
        run: mise run check:leaks:full
      - name: Scan full checkout
        # Delegate to the task so this never drifts from the local gate.
        run: mise run check:scan
      - name: Audit workflows online
        # The CI gate stays offline for speed and determinism. This weekly pass adds
        # the audits that query GitHub (impostor commits, ref confusion, known
        # vulnerable actions); the job's read-only token is sufficient.
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run check:actions:online
