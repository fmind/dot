# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Security
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: security
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  UV_LOCKED: "1"
jobs:
  scan:
    name: Full-history scan
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain
        # jactionlint ignore=self-repository
        uses: ./.github/actions/setup-mise
      - name: Scan complete Git history
        run: mise run check:leaks:full
      - name: Scan full checkout and commits for privacy findings
        run: mise run check:privacy
      - name: Scan full checkout and audit locked dependencies
        # Delegate to the task so this never drifts from `mise run check:network` (Trivy and uv audit).
        run: mise run check:network
      - name: Audit workflows online
        # The CI gate stays offline for speed and determinism. This weekly pass adds
        # the audits that query GitHub (impostor commits, ref confusion, known
        # vulnerable actions); the job's read-only token is sufficient.
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run check:actions:online
      - name: Check external documentation links online
        # CI stays offline for determinism; this weekly pass catches external URL and fragment drift.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run check:skills:links:online
