# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Security
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  scan:
    name: Full-history scan
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: true
          # Match the tested bootstrap baseline and revision-4 lockfile reader.
          version: 2026.11.6
      - name: Scan complete Git history
        run: mise run check:leaks:full
      - name: Scan full checkout and audit locked dependencies
        # Delegate to the task so this never drifts from the local pre-push gate (Trivy and uv audit).
        run: mise run check:network
      - name: Audit workflows online
        # The CI gate stays offline for speed and determinism. This weekly pass adds
        # the audits that query GitHub (impostor commits, ref confusion, known
        # vulnerable actions); the job's read-only token is sufficient.
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run check:actions:online
