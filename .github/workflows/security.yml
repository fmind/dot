name: Security
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security
  cancel-in-progress: true
jobs:
  scan:
    name: Full-history scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Trust repository
        run: mise trust -y mise.toml
      - name: Report fixed and unfixed advisories
        run: mise run report:vuln -- "$RUNNER_TEMP/trivy-unfixed.json"
      - name: Upload advisory report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fixed-and-unfixed
          path: ${{ runner.temp }}/trivy-unfixed.json
          retention-days: 14
      - name: Scan full checkout
        # Delegate to the task so this never drifts from the local gate again; the
        # hand-written copy had already lost --tf-vars and scanned the Terraform
        # module with unresolved variables.
        run: mise run check:scan
      - name: Scan complete Git history
        run: gitleaks git --redact=100 --verbose
