# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # `check:leaks` scans commits, not just the working tree, and is capped at
      # the last 100 (see mise.toml). Fetch exactly that depth so CI and the local
      # task cover the same commits instead of cloning history nothing reads.
      - name: Checkout recent history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          # Match the tested bootstrap baseline and format-2 lockfile reader.
          version: 2026.9.10
      - name: Run canonical gate
        run: mise run all
      - name: Verify clean tree
        run: |
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test -z "$status"
  macos:
    # Exercise native process, filesystem, shell, and starter behavior as well as
    # template rendering. Installing the toolchain also checks its macOS locks.
    name: Test on macOS
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          version: 2026.9.10
      - name: Render chezmoi source
        run: mise run check:chezmoi
      - name: Run repository tests
        run: mise run test
      - name: Run starter contracts
        run: mise run test:starters
      - name: Verify clean tree
        run: |
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test -z "$status"
