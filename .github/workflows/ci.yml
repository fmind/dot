# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call: # CD runs these jobs on the tagged commit before publishing.
    inputs:
      cache:
        description: Read the shared mise tool cache; CD passes "false" to avoid reusing cached binaries
        type: string
        default: "true"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
defaults:
  run:
    shell: bash
env:
  UV_LOCKED: "1"
jobs:
  ci:
    name: CI
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain
        # jactionlint ignore=self-repository
        uses: ./.github/actions/setup-mise
        with:
          cache: ${{ inputs.cache || 'true' }}
      - name: Sync dot environment
        run: uv sync --locked --project dot
      - name: Run canonical gate
        run: mise run all
      - name: Check Fish completion generators
        run: mise run check:completions
      - name: Verify clean tree
        run: git status --short && [ -z "$(git status --porcelain)" ]
  starters:
    # Run network-resolving starter contracts in parallel with the canonical Linux gate.
    name: Starter contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        # jactionlint ignore=self-repository
        uses: ./.github/actions/setup-mise
        with:
          cache: ${{ inputs.cache || 'true' }}
      - name: Run starter contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run test:starters
      - name: Verify clean tree
        run: git status --short && [ -z "$(git status --porcelain)" ]
  macos:
    # Exercise native process, filesystem, and shell behavior as well as
    # template rendering. Installing the toolchain also checks its macOS locks.
    name: Test on macOS
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        # jactionlint ignore=self-repository
        uses: ./.github/actions/setup-mise
        with:
          cache: ${{ inputs.cache || 'true' }}
      - name: Render chezmoi and shell templates
        run: |
          mise run check:chezmoi
          mise run check:shell
      - name: Sync dot environment
        run: uv sync --locked --project dot
      - name: Run repository tests
        run: mise run test
      - name: Verify clean tree
        run: git status --short && [ -z "$(git status --porcelain)" ]
  macos-starters:
    # Run network-resolving starter contracts in parallel with the macOS test suite.
    name: Starter contracts on macOS
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        # jactionlint ignore=self-repository
        uses: ./.github/actions/setup-mise
        with:
          cache: ${{ inputs.cache || 'true' }}
      - name: Run starter contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run test:starters
      - name: Verify clean tree
        run: git status --short && [ -z "$(git status --porcelain)" ]
