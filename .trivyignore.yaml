  # cf pins these exactly (miniflare: undici 7.29.1; @cloudflare/config: zod 4.6.5), so relocking
  # cannot pick the fixes. A short expiry forces a re-check against the next beta.
  - id: CVE-2026-109869
    paths: ["dot_config/mise/locks/npm-cf/*/aube-lock.yaml"]
    statement: Accepted for the local cf beta CLI until upstream bumps its exact undici pin.
    expired_at: 2026-11-07
