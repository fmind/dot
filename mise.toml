# :schema https://mise.jdx.dev/schema/mise.json
# Docs: https://mise.jdx.dev/configuration.html

# Keep equal to install.sh and the workflow pins (test_bootstrap enforces it).
min_version = "2026.10.18"

[settings]
# Signature and provenance verification keep mise defaults here, so CI (which has no
# home config) verifies every repository tool; the workstation config opts out globally.
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[settings.task]
run_auto_install = false
# Hide command echoes; keep task output, failure diagnostics, and task-name prefixes.
# MISE_TASK_QUIET=false restores mise's execution messages for debugging.
quiet = true

[vars]
# Skill templates scaffold other repositories' workflows; the workflow linters skip them unless named.
workflow_templates = "skills/github-actions/references/ci-cd/templates/*.yml skills/cloud-run/templates/deploy.yml skills/documentation-site/templates/docs.yml"
# Plain shell scripts that shfmt formats; chezmoi shell templates are rendered and linted only.
shell_scripts = "install.sh run_*.sh dot_local/bin/executable_*"
# uv installs the dot entry point here; the absolute path avoids Graphviz's dot on PATH.
dot_bin = "{{env.HOME}}/.local/bin/dot"
# Run mise on repository tools without the workstation's home config, like CI: a stale home
# config must not block the tools that repair it, and its disabled provenance checks make
# mise refuse a lockfile that records GitHub attestations.
repo_mise = 'MISE_IGNORED_CONFIG_PATHS="${MISE_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/mise}" mise'

[env]
# Export only values that are safe in any repository: agent shells snapshot this
# environment and keep it after leaving the checkout. Tasks therefore pass `--project dot`,
# set COVERAGE_FILE, and use [vars] for checkout paths; an exported UV_PROJECT would
# silently resolve the dot project from another repository.
# Chezmoi traverses the source tree during parallel checks. Python's temporary
# bytecode files can disappear between its directory listing and lstat calls.
PYTHONDONTWRITEBYTECODE = "1"

[tool_alias]
fish = "aqua:fish-shell/fish-shell"
# The registry default (vfox) locks release URLs without digests; aqua locks checksums.
neovim = "aqua:neovim/neovim"

[tools]
actionlint = "latest"
chezmoi = "latest"
dprint = "latest"
fish = "latest"
gh = "latest"
git-cliff = "latest"
gitleaks = "latest"
lefthook = "latest"
lychee = "latest"
neovim = "latest"
# Keep binary-only Python tools installable while their wheels catch up with 3.15.
python = "3.14"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
trivy = "latest"
uv = "latest"
zizmor = "latest"

# Canonical project tasks.

[tasks.all]
alias = "a"
description = "Run the full CI gate locally (format, check, test, build)"
run = ["mise run format", "mise run check", "mise run test", "mise run build"]

[tasks.build]
alias = "b"
description = "Build the dot Python source distribution and wheel"
run = "uv build dot --out-dir dot/dist --clear"
sources = ["dot/pyproject.toml", "dot/uv.lock", "dot/LICENSE", "dot/src/**/*.py", "dot/src/**/*.yaml"]
outputs = ["dot/dist/*.whl", "dot/dist/*.tar.gz"]

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = ["check:local", "check:network"]

[tasks."check:local"]
description = "Run the static checks that need no remote database (pre-commit)"
depends = [
  "check:actions",
  "check:chezmoi",
  "check:fish",
  "check:format",
  "check:leaks",
  "check:lua",
  "check:python",
  "check:shell",
  "check:skills",
  "check:tools",
]

[tasks."check:network"]
description = "Run the checks that download vulnerability data (pre-push)"
depends = ["check:scan", "check:vuln"]

[tasks."check:actions"]
description = "Validate GitHub Actions workflows, shipped workflow templates, and Dependabot config"
run = [
  "actionlint .github/workflows/*.yml {{vars.workflow_templates}}",
  "zizmor --offline --strict-collection .github/ {{vars.workflow_templates}}",
]

[tasks."check:actions:online"]
description = "Audit workflows with zizmor's online rules (needs GH_TOKEN; weekly in security.yml)"
run = "zizmor --strict-collection .github/ {{vars.workflow_templates}}"

[tasks."check:chezmoi"]
description = "Validate rendered chezmoi source in an isolated destination"
run = """
render_config="$(mktemp -d)"
render_destination="$(mktemp -d)"
trap 'rm -rf "$render_destination" "$render_config"' EXIT
# Separate state also prevents parallel validation from locking the live workstation.
chezmoi init --source "$PWD" --config-path "$render_config/chezmoi.toml" --persistent-state "$render_config/state.boltdb" --promptDefaults
chezmoi apply --dry-run --force --source "$PWD" --destination "$render_destination" --config "$render_config/chezmoi.toml" --persistent-state "$render_config/state.boltdb" --exclude=encrypted
"""

[tasks."check:format"]
description = "Check config and markup formatting (dprint)"
run = "dprint check"

[tasks."check:fish"]
description = "Validate Fish syntax without loading user configuration (behavior tests run in test)"
run = """
for file in dot_config/fish/*.fish dot_config/fish/conf.d/*.fish dot_config/fish/completions/*.fish dot_config/fish/functions/*.fish; do
  fish --no-config --no-execute "$file"
done
"""

[tasks."check:leaks"]
description = "Scan working-tree files, including untracked files, for leaked secrets"
# The pre-commit hook runs this through check:local; check:leaks:full covers the history weekly.
run = "gitleaks dir . --redact=100 --verbose --no-banner"

[tasks."check:leaks:full"]
description = "Scan the complete Git history (weekly in security.yml; needs a full clone)"
run = "gitleaks git --redact=100 --verbose --no-banner"

[tasks."check:lua"]
description = "Check Neovim Lua formatting (stylua)"
run = "stylua --check dot_config/nvim"

[tasks."check:python"]
description = "Lint, format-check, type-check, and validate Python packaging"
# ruff.toml scopes Ruff.
run = [
  "uv run --frozen --project dot ruff check .",
  "uv run --frozen --project dot ruff format --check .",
  "uv run --frozen --project dot ty check --project dot dot skills --exclude 'skills/*/references/*/templates'",
  "uv run --frozen --project dot validate-pyproject dot/pyproject.toml",
  "uv lock --check --project dot",
]

[tasks."check:scan"]
description = "Scan dependencies, including mise tool locks, and IaC (Trivy)"
# Pass the config explicitly: the workstation's TRIVY_CONFIG (fish env.fish) replaces trivy's
# ./trivy.yaml default, which would drop this repository's ignorefile.
run = "trivy --config trivy.yaml fs --tf-vars skills/infra-as-code/templates/terraform.example.tfvars ."

[tasks."check:shell"]
description = "Lint shell scripts and rendered chezmoi shell templates; format-check install.sh and plain run scripts"
# shellcheck cannot parse {{ }} actions, so templates are rendered first; they use only
# built-in .chezmoi data, so no init is needed. Modify templates render their managed
# block against an empty target. shfmt skips templates: it cannot rewrite a template
# from its rendered copy.
run = """
rendered="$(mktemp -d)"
trap 'rm -rf "$rendered"' EXIT
for template in run_*.sh.tmpl modify_dot_*; do
  chezmoi execute-template --source "$PWD" --with-stdin --file "$template" </dev/null >"$rendered/${template%.tmpl}.bash"
done
shellcheck --rcfile dot_config/shellcheckrc {{vars.shell_scripts}} "$rendered"/*.bash
shfmt -d -i 2 -s {{vars.shell_scripts}}
"""

[tasks."check:skills"]
description = "Validate first-party Agent Skill packages, context budgets, and documentation links"
run = [
  "gh skill publish --dry-run skills",
  "uv run --frozen --directory dot python -m dot_tasks.skill_contracts",
  # Generated-project templates link relative to their future repository.
  "lychee --offline --include-fragments --no-progress --exclude-path 'skills/.*/templates' README.md AGENTS.md dot_agents/AGENTS.md .github/SECURITY.md 'skills/**/*.md' '.agents/skills/**/*.md'",
]

[tasks."check:tools"]
description = "Validate repository task definitions"
run = "mise tasks validate"

[tasks."check:completions"]
description = "Validate active Fish completion generators without changing installed scripts"
run = "uv run --frozen --project dot dot completion --check"

[tasks."check:vuln"]
description = "Audit the locked Python dependency graph"
run = "uv audit --project dot --preview-features audit-command --locked"

[tasks."report:coverage"]
description = "Show per-file coverage from the last test run without rerunning tests"
env = { COVERAGE_FILE = "{{config_root}}/dot/.coverage" }
run = "uv run --frozen --project dot coverage report --rcfile=dot/pyproject.toml"

[tasks.format]
alias = "f"
description = "Format all active sources and documents"
depends = ["format:dprint", "format:lua", "format:python", "format:shell", "format:skills"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, and YAML"
# Order after the index generator without depending on it: pre-commit formats only
# staged files, and check:skills then rejects a stale index instead of this task
# regenerating SKILL.md files that the commit would not include.
wait_for = ["format:skills"]
run = "dprint fmt --allow-no-files"

[tasks."format:skills"]
description = "Generate parent routing indexes from guide metadata"
run = "uv run --frozen --directory dot python -m dot_tasks.skill_contracts --sync"

# Lefthook passes staged files to these formatters; mise hands variadic arguments
# over as one shell-quoted string, which `eval "set -- ..."` splits back safely.
[tasks."format:lua"]
description = "Format Neovim Lua sources, or only the given files"
usage = 'arg "[files]..." default="dot_config/nvim"'
run = 'eval "set -- $usage_files" && stylua "$@"'

[tasks."format:python"]
description = "Apply safe lint fixes and format Python sources, or only the given files"
usage = 'arg "[files]..." default="."'
run = '''
eval "set -- $usage_files"
uv run --frozen --project dot ruff check --fix-only "$@"
uv run --frozen --project dot ruff format "$@"
'''

[tasks."format:shell"]
description = "Format plain shell scripts, or only the given files (templates stay lint-only)"
usage = 'arg "[files]..."'
run = '''
eval "set -- $usage_files"
[ "$#" -gt 0 ] || set -- {{vars.shell_scripts}}
shfmt -w -i 2 -s "$@"
'''

[tasks.install]
alias = "i"
description = "Bootstrap a freshly initialized checkout"
run = [
  "mise run full",
  "mise run hooks",
  "mise run vim",
  "echo '✓ First-time bootstrap complete.'",
]

[tasks.test]
alias = "t"
description = "Run the Python CLI and repository contract tests"
# Archive tests are fsync-bound; 8 workers overlap syncs without risking OOM.
# Keep the total and threshold; report:coverage reads per-file detail from dot/.coverage.
env = { COVERAGE_FILE = "{{config_root}}/dot/.coverage" }
run = "uv run --frozen --project dot pytest -q -n auto --maxprocesses 8 dot/tests --cov --cov-config=dot/pyproject.toml --cov-report="

[tasks."test:starters"]
description = "Materialize and execute the Python library, CLI, and web starter contracts"
env = { DOT_STARTER_SMOKE = "1" }
run = "uv run --frozen --project dot pytest -q dot/tests/test_python_starter.py"

# Project management tasks. Every alias begins with m.

[tasks.apply]
alias = "ma"
description = "Apply the chezmoi source tree"
run = "chezmoi apply --force"

[tasks.completions]
alias = "mg"
description = "Generate Fish completions for installed CLI tools"
run = '"{{vars.dot_bin}}" completion'

[tasks.deploy]
alias = "me"
description = "Install the dot CLI from this checkout with its locked dependency versions"
# uv tool install ignores uv.lock, so the exported lock constrains it (uv skips constraint
# hashes). --reinstall rebuilds unversioned source edits; --force replaces another ~/.local/bin/dot.
run = [
  "uv export --project dot --frozen --no-dev --no-emit-project --no-hashes --quiet --output-file dot/dist/constraints.txt",
  "uv tool install --reinstall --force --python 3.14 --constraints dot/dist/constraints.txt ./dot",
]

[tasks.diff]
alias = "md"
description = "Show the pending chezmoi diff"
run = "chezmoi diff --force --no-pager --exclude encrypted"

[tasks.doctor]
alias = "mo"
description = "Run the dot, chezmoi, and mise workstation health checks"
# chezmoi probes hardlinks from its source into TMPDIR; /tmp can be another filesystem.
run = ['"{{vars.dot_bin}}" doctor', 'TMPDIR="$(chezmoi source-path)" chezmoi doctor', "mise doctor"]

[tasks.hooks]
alias = "mh"
description = "Install repository Git hooks"
run = "lefthook install"

[tasks.lock]
alias = "mk"
description = "Refresh Python, repo, and home lockfiles"
# The Neovim lockfile is captured only by upgrade, after it applies and updates plugins:
# re-adding here would copy an older deployed lock over a newer pulled source.
run = [
  "uv lock --project dot",
  "{{vars.repo_mise}} lock --yes",
  # Resolve the portable source baseline, without machine-local tool overrides.
  "uv run --frozen --directory dot python -m dot_tasks.mise_refresh",
]

[tasks.release]
alias = "mr"
description = "Prepare, tag, and push the next release; CD publishes it"
run = "uv run --frozen --directory dot python -m dot_tasks.release"

[tasks.full]
description = "Install locked repository and global tools, apply dotfiles, deploy dot, and regenerate completions"
run = [
  "{{vars.repo_mise}} --locked install -y",
  # Seed tool configuration without invoking missing or outdated hook executables.
  "chezmoi apply --force --exclude scripts",
  # chezmoi keeps deployed targets whose source was removed: drop superseded version graphs
  # on every machine that syncs, not only on the one that upgraded. Retire before installing:
  # mise reuses an install directory whose graph changed, so the install below rebuilds it.
  'uv run --frozen --directory dot python -m dot_tasks.mise_locks "$HOME/.config/mise/mise.lock"',
  "mise -C \"$HOME\" --locked install -y",
  "mise run deploy",
  # Hooks now see the current dot and global tools on the very first bootstrap.
  "mise run apply",
  "mise run completions",
]

[tasks.upgrade]
alias = "mu"
description = "Upgrade Python dependencies, mise tools, the theme pin, dprint plugins, and Neovim plugins"
run = [
  "uv lock --upgrade --project dot",
  # Refresh version pins before installing the selected releases.
  "{{vars.repo_mise}} lock --bump --yes",
  "uv run --frozen --directory dot python -m dot_tasks.mise_refresh --bump",
  # Advance the checksummed fmind/theme pin; several theme files execute.
  "uv run --frozen --directory dot python -m dot_tasks.theme_pin",
  # Publish the complete bundle before installation; rerun full after a failed install.
  "mise run full",
  "dprint config update --yes",
  "nvim --headless '+Lazy! update' +qa",
  "mise run vim",
  # Physical path: installed skill links record it, and the catalog check rejects a symlinked checkout path.
  'chezmoi re-add --source "$(pwd -P)" ~/.config/nvim/lazy-lock.json',
]

[tasks.vim]
alias = "mv"
description = "Synchronize Neovim plugins headlessly"
run = "nvim --headless '+Lazy! restore' '+Lazy! clean' '+lua require(\"config.sync-parsers\")' +qa"
