# :schema https://mise.jdx.dev/schema/mise.json
# Docs: https://mise.jdx.dev/configuration.html

[settings]
aqua.cosign = false
aqua.github_attestations = false
aqua.minisign = false
aqua.slsa = false
github.github_attestations = false
github.slsa = false
github_attestations = false
locked_verify_provenance = false
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]
slsa = false

[settings.task]
run_auto_install = false

[task_config]
# This repository is also the home-level mise source, so pin every task to this file.
dir = "{{config_root}}"

[env]
COVERAGE_FILE = "{{config_root}}/dot/.coverage"
DOT_BIN = "{{env.HOME}}/.local/share/fmind-dot/current/bin/dot"
UV_PROJECT = "{{config_root}}/dot"

[tools]
actionlint = "latest"
chezmoi = "latest"
dprint = "latest"
fish = "4.9.2"
gh = "latest"
git-cliff = "latest"
gitleaks = "latest"
lefthook = "latest"
neovim = "latest"
python = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
trivy = "latest"
uv = "latest"
zizmor = "latest"

# Canonical project tasks.

[tasks.all]
alias = "a"
description = "Run the full CI gate locally (format, check, test, build)"
run = ["mise run format", "mise run check", "mise run test", "mise run build"]

[tasks.build]
alias = "b"
description = "Build the dot Python source distribution and wheel"
run = "uv build --out-dir dot/dist --clear"
sources = ["dot/pyproject.toml", "dot/uv.lock", "dot/src/**/*.py"]
outputs = ["dot/dist/*.whl", "dot/dist/*.tar.gz"]

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = [
  "check:actions",
  "check:chezmoi",
  "check:docs",
  "check:fish",
  "check:format",
  "check:leaks",
  "check:lua",
  "check:python",
  "check:scan",
  "check:shell",
  "check:skills",
  "check:tools",
  "check:vuln",
]

[tasks."check:actions"]
alias = "ca"
description = "Validate GitHub Actions workflows and Dependabot config"
run = ["actionlint", "zizmor --offline .github/"]

[tasks."check:chezmoi"]
alias = "cc"
description = "Validate rendered chezmoi source in an isolated destination"
run = """
render_config="$(mktemp -d)"
render_destination="$(mktemp -d)"
trap 'rm -rf "$render_destination" "$render_config"' EXIT
chezmoi init --source "$PWD" --config-path "$render_config/chezmoi.toml" --promptDefaults
chezmoi apply --dry-run --force --source "$PWD" --destination "$render_destination" --config "$render_config/chezmoi.toml" --exclude=encrypted
"""

[tasks."check:docs"]
alias = "co"
description = "Validate documentation against the Python CLI and repository paths"
run = "uv run --frozen pytest -q dot/tests/test_contracts.py -k documentation"

[tasks."check:format"]
alias = "cf"
description = "Check config and markup formatting (dprint)"
run = "dprint check"

[tasks."check:fish"]
description = "Validate Fish syntax without loading user configuration"
run = "for file in dot_config/fish/*.fish dot_config/fish/conf.d/*.fish; do fish --no-config --no-execute \"$file\"; done"

[tasks."check:leaks"]
alias = "cl"
description = "Audit recent commits for leaked secrets (gitleaks)"
run = "gitleaks git --redact=100 --log-opts=\"--max-count=100\" --verbose"

[tasks."check:lua"]
alias = "cu"
description = "Check Neovim Lua formatting (stylua)"
run = "stylua --check dot_config/nvim"

[tasks."check:python"]
alias = "cp"
description = "Lint, format-check, type-check, and validate Python packaging"
run = [
  "uv run --frozen ruff check dot dot_config/ptpython/config.py",
  "uv run --frozen ruff format --check dot dot_config/ptpython/config.py",
  "uv run --frozen ty check dot/src dot/tests",
  "uv run --frozen validate-pyproject dot/pyproject.toml",
  "uv lock --check",
]

[tasks."check:scan"]
alias = "ct"
description = "Scan dependencies, IaC, licenses, and secrets (Trivy)"
run = "trivy --config trivy.yaml fs --tf-vars skills/terraform/references/terraform.example.tfvars ."

[tasks."check:shell"]
alias = "cs"
description = "Lint and format-check shell scripts, including rendered chezmoi sources"
run = """
set -eu
shellcheck --rcfile dot_config/shellcheckrc install.sh
shfmt -d -i 2 -s install.sh
for template in run_once_*.sh.tmpl; do
  printf 'In %s:\n' "$template"
  rendered="$(chezmoi execute-template --file "$template")"
  printf '%s\n' "$rendered" | shellcheck --rcfile dot_config/shellcheckrc --external-sources --shell=bash -
  printf '%s\n' "$rendered" | shfmt -d -i 2 -s -
done
for modifier in modify_dot_bashrc modify_dot_profile; do
  printf 'In %s:\n' "$modifier"
  rendered="$(printf '%s\n' '# existing shell configuration' | chezmoi execute-template --with-stdin --file "$modifier")"
  printf '%s\n' "$rendered" | shellcheck --rcfile dot_config/shellcheckrc --external-sources --shell=bash -
  printf '%s\n' "$rendered" | shfmt -d -i 2 -s -
done
"""

[tasks."check:skills"]
alias = "ck"
description = "Validate first-party Agent Skill packages"
run = [
  "gh skill publish --dry-run skills",
  "uv run --frozen pytest -q dot/tests/test_contracts.py -k skills",
]

[tasks."check:tools"]
alias = "cw"
description = "Validate repository task definitions"
run = "mise tasks validate"

[tasks."check:vuln"]
alias = "cv"
description = "Audit the locked Python dependency graph"
run = "uv audit --preview-features audit-command --locked"

[tasks."check:vuln:tools"]
description = "Audit installed npm and pipx tool environments"
run = "uv run --frozen python -m fmind_dot.tool_audit"

[tasks."report:skills"]
description = "Report informational skill routing diagnostics"
run = "uv run --frozen python -m fmind_dot.skill_contracts --report"

[tasks.format]
alias = "f"
description = "Format all active sources and documents"
depends = ["format:dprint", "format:lua", "format:python", "format:shell"]

[tasks."format:dprint"]
alias = "fd"
description = "Format JSON, Markdown, TOML, and YAML"
run = "dprint fmt --allow-no-files"

[tasks."format:lua"]
alias = "fu"
description = "Format Neovim Lua sources"
run = "stylua dot_config/nvim"

[tasks."format:python"]
alias = "fp"
description = "Format Python sources and imports"
run = [
  "uv run --frozen ruff check --select=I --fix dot dot_config/ptpython/config.py",
  "uv run --frozen ruff format dot dot_config/ptpython/config.py",
]

[tasks."format:shell"]
alias = "fs"
description = "Format shell scripts"
run = "shfmt -w -i 2 -s install.sh"

[tasks.install]
alias = "i"
description = "Bootstrap a freshly initialized checkout"
run = [
  "mise trust -y mise.toml",
  "mise run tools",
  "mise run hooks",
  "mise run vim",
  "echo '✓ First-time bootstrap complete.'",
]

[tasks.test]
alias = "t"
description = "Run the Python CLI and repository contract tests"
run = "uv run --frozen pytest -q -n auto dot/tests --cov=fmind_dot --cov-config=dot/pyproject.toml --cov-report=term-missing"

[tasks."test:starters"]
description = "Materialize and execute the Python CLI starter contract"
env = { DOT_STARTER_SMOKE = "1" }
run = "uv run --frozen pytest -q dot/tests/test_python_starter.py"

[tasks.watch]
alias = "w"
description = "Re-run the Python test suite on every change"
run = "uv run --frozen ptw dot/tests -- -q"

# Project management tasks. Every alias begins with m.

[tasks.apply]
alias = "ma"
description = "Apply the chezmoi source tree"
run = "chezmoi apply --force"

[tasks.completions]
alias = "mg"
description = "Generate Fish completions for installed CLI tools"
run = '"$DOT_BIN" completion'

[tasks.deploy]
alias = "me"
description = "Build and install the dot Python CLI from its locked runtime graph"
run = "\"$(mise which python)\" -I dot/src/fmind_dot/deploy.py \"$PWD\" \"$(mise which uv)\""

[tasks.diff]
alias = "md"
description = "Show the pending chezmoi diff"
run = "chezmoi diff --force"

[tasks.doctor]
alias = "mo"
description = "Run chezmoi and mise health checks"
run = ["chezmoi doctor", "mise doctor"]

[tasks.full]
alias = "mf"
depends = ["tools"]
description = "Apply dotfiles and synchronize global tools"
run = "echo '✓ Dot deployed.'"

[tasks.hooks]
alias = "mh"
description = "Install repository Git hooks"
run = "lefthook install"

[tasks.lock]
alias = "mk"
description = "Refresh Python, repo, home, and Neovim lockfiles"
run = [
  "uv lock",
  "mise lock --yes",
  "mise lock --global --yes",
  "chezmoi re-add --source \"$PWD\" ~/.config/mise/mise.lock",
  "chezmoi re-add --source \"$PWD\" ~/.config/nvim/lazy-lock.json",
]

[tasks.prune]
alias = "mp"
description = "Remove unused tools, containers, and development caches"
run = "uv run --frozen dot prune --all --deep"

[tasks.release]
alias = "mr"
description = "Prepare and dispatch an exact-head GitHub release"
run = "uv run --frozen dot release"

[tasks.tools]
alias = "mt"
description = "Install the locked repository and global tools"
run = [
  "mise --locked install -y",
  "mise run apply",
  "mise trust -y ~/.config/mise/config.toml",
  "mise -C \"$HOME\" --locked install -y",
  "mise run deploy",
  "mise run completions",
]

[tasks.trust]
alias = "mtr"
description = "Trust repository and home mise configs"
run = [
  "mise trust -y mise.toml",
  "mise trust -y ~/.config/mise/config.toml",
]

[tasks.upgrade]
alias = "mu"
description = "Upgrade Python dependencies, mise tools, and Neovim plugins"
run = [
  "uv lock --upgrade",
  "mise -C \"$HOME\" upgrade",
  "mise upgrade --local",
  "nvim --headless '+Lazy! update' +qa",
  "mise run vim",
  "mise run lock",
  "mise run tools",
]

[tasks.verify]
alias = "mx"
description = "Run the dot workstation sanity checks"
run = '"$DOT_BIN" verify'

[tasks.vim]
alias = "mv"
description = "Synchronize Neovim plugins headlessly"
run = "nvim --headless '+Lazy! restore' '+Lazy! clean' '+lua require(\"config.sync-parsers\")' +qa"
