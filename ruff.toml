# Docs: https://docs.astral.sh/ruff/configuration/
line-length = 120
# Scripts outside dot/ carry no requires-python to infer the target from.
target-version = "py314"
# Guide templates under skills/*/references hold scaffolds with <placeholder> tokens that are
# not valid Python; every other skill script is linted like first-party code.
# dprint owns Markdown, including the Python blocks inside it.
extend-exclude = [
  "skills/*/references/*/templates",
  "*.md",
]
force-exclude = true

[per-file-target-version]
# agy runs this renderer with the first python3 on PATH, possibly an older system one.
"private_dot_gemini/private_antigravity-cli/display.py" = "py39"
# CD runs this helper with ubuntu-26.04's system python3 (3.14), independent of dot's Python version.
"skills/cloud-run/templates/verify-private.py" = "py314"

[format]
docstring-code-format = true
line-ending = "lf"

[lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "ERA",
  "F",
  "FURB",
  "I",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PLE",
  "PLW", # subprocess (such as subprocess.run without check)
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "T10",
  "T20",
  "TID",
  "UP",
  "W",
]
ignore = [
  "E501", # line length allowed for long URLs, strings, and templates
  "PLW0108", # unnecessary-lambda: style, outside Ruff's default set
  "PLW2901", # redefined-loop-name: deliberate rebinding, outside Ruff's default set
]
