# Docs: https://github.com/betterleaks/betterleaks/blob/v1.x/docs/config.md
title = "fmind/dot"

[extend]
useDefault = true

[[allowlists]]
description = "Encrypted secrets stay in-tree."
paths = ['''\.age$''']

[[allowlists]]
description = "Peer-dependency version key for @inquirer/password in retired firebase-tools lock history; check:leaks:full still needs it."
condition = "AND"
regexTarget = "line"
paths = ['''^dot_config/mise/locks/npm-firebase-tools/''']
regexes = ['''@inquirer/password''']
commits = ["3e05d243334cb6e46f62a1e3dd3c9950fe2706f5"]

[[allowlists]]
description = "CLI flag prose in past auth-status revisions (`gcloud auth application-default login`, `...`) is not a password assignment; check:leaks:full still needs it."
