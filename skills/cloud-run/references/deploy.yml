# Cloud Run continuous deployment. Authentication uses Workload Identity
# Federation; the workflow stores no service-account key.
name: CD
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  deploy-cloud-run:
    if: ${{ vars.ENABLE_DEPLOY_CLOUDRUN == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the project toolchain and pinned image tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          tool_versions: |
            cosign 3.1.3
            trivy 0.74.0
      - name: Verify pinned image tools
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(cosign version | awk '$1 == "GitVersion:" { print $2 }')" == "v3.1.3" ]]
          [[ "$(trivy --version | awk '$1 == "Version:" { print $2; exit }')" == "0.74.0" ]]
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Configure Artifact Registry
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GCP_REGION" =~ ^[a-z0-9-]+$ ]]
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Build and push the Python image
        id: image
        env:
          GCP_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          IMAGE_REPOSITORY: ${{ vars.GCP_ARTIFACT_IMAGE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GCP_RUNTIME_SA" =~ ^[a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com$ ]]
          [[ "$IMAGE_REPOSITORY" =~ ^[^[:space:]@]+$ ]]
          metadata="$RUNNER_TEMP/image-metadata.json"
          docker buildx build --push --tag "$IMAGE_REPOSITORY:$GITHUB_REF_NAME" --metadata-file "$metadata" .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata")"
          printf 'ref=%s@%s\n' "$IMAGE_REPOSITORY" "$digest" >>"$GITHUB_OUTPUT"
      - name: Scan, sign, verify, and attest
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]
          sbom="$RUNNER_TEMP/sbom.cdx.json"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cd.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          trivy --config trivy.yaml image "$IMAGE"
          trivy --config trivy.yaml image --format cyclonedx --output "$sbom" "$IMAGE"
          cosign sign --yes "$IMAGE"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$IMAGE"
          cosign attest --yes --type cyclonedx --predicate "$sbom" "$IMAGE"
          cosign verify-attestation --type cyclonedx --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$IMAGE"
      - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ vars.CLOUDRUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.image.outputs.ref }}
          flags: --service-account=${{ vars.GCP_RUNTIME_SA }} --no-allow-unauthenticated
