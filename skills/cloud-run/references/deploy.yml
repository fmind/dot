# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# Cloud Run continuous deployment. Authentication uses Workload Identity
# Federation; the workflow stores no service-account key.
name: CD
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  deploy-cloud-run:
    if: ${{ vars.ENABLE_DEPLOY_CLOUDRUN == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/cd.yml@${{ github.ref }}
      ISSUER: https://token.actions.githubusercontent.com
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the project toolchain and pinned image tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          tool_versions: |
            cosign 3.1.3
            trivy 0.74.0
      - name: Verify pinned image tools
        shell: bash
        run: |
          [[ "$(cosign version | awk '$1 == "GitVersion:" { print $2 }')" == "v3.1.3" ]]
          [[ "$(trivy --version | awk '$1 == "Version:" { print $2; exit }')" == "0.74.0" ]]
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Configure Artifact Registry
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        shell: bash
        run: |
          [[ "$GCP_REGION" =~ ^[a-z0-9-]+$ ]]
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Validate deployment inputs
        env:
          GCP_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          IMAGE_REPOSITORY: ${{ vars.GCP_ARTIFACT_IMAGE }}
        shell: bash
        run: |
          [[ "$GCP_RUNTIME_SA" =~ ^[a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com$ ]]
          [[ "$IMAGE_REPOSITORY" =~ ^[^[:space:]@]+$ ]]
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push the Python image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ vars.GCP_ARTIFACT_IMAGE }}:${{ github.ref_name }}
      - name: Validate image digest
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ vars.GCP_ARTIFACT_IMAGE }}
        shell: bash
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'ref=%s@%s\n' "$IMAGE_REPOSITORY" "$DIGEST" >> "$GITHUB_OUTPUT"
          printf 'IMAGE=%s@%s\n' "$IMAGE_REPOSITORY" "$DIGEST" >> "$GITHUB_ENV"
          printf 'SBOM=%s/sbom.cdx.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Scan image
        run: trivy --config trivy.yaml image --skip-dirs '' "$IMAGE"
      - name: Generate image SBOM
        run: trivy --config trivy.yaml image --skip-dirs '' --format cyclonedx --output "$SBOM" "$IMAGE"
      - name: Sign image
        run: cosign sign --yes "$IMAGE"
      - name: Verify image signature
        run: cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE"
      - name: Attest image SBOM
        run: cosign attest --yes --type cyclonedx --predicate "$SBOM" "$IMAGE"
      - name: Verify image attestation
        run: cosign verify-attestation --type cyclonedx --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE"
      - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ vars.CLOUDRUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.image.outputs.ref }}
          env_vars: |
            HOST=0.0.0.0
            ENVIRONMENT=production
          # Required by the Python database-backed starter; adapt to the app.
          secrets: |
            DATABASE_URL=database-url:latest
          flags: --service-account=${{ vars.GCP_RUNTIME_SA }} --no-allow-unauthenticated
