# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# Cloud Run continuous deployment. Authentication uses Workload Identity
# Federation; the workflow stores no service-account key.
name: CD
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: cloud-run-${{ vars.GCP_REGION }}-${{ vars.CLOUDRUN_SERVICE }}
  cancel-in-progress: false
env:
  # Each deploy moves this traffic tag to the new no-traffic candidate revision.
  CANDIDATE_TAG: candidate
jobs:
  validate:
    name: Validate tagged revision
    if: ${{ vars.ENABLE_DEPLOY_CLOUDRUN == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # Pin the mise that reads the repository's lockfile; the action installs latest otherwise.
          version: 2026.11.2
          cache: false
      - name: Validate the tagged revision
        run: mise run all
      - name: Verify no changes
        run: |
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test -z "$status"
  deploy-cloud-run:
    name: Deploy private Cloud Run service
    if: ${{ vars.ENABLE_DEPLOY_CLOUDRUN == 'true' }}
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/cd.yml@${{ github.ref }}
      ISSUER: https://token.actions.githubusercontent.com
    permissions:
      contents: read
      id-token: write # Authenticate to Google Cloud and sign the image through OIDC.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the project toolchain and image tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # Pin the mise that reads the repository's lockfile; the action installs latest otherwise.
          version: 2026.11.2
          cache: false
          # The project's mise.toml and mise.lock own the exact cosign and Trivy versions.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Install the pinned Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          # The action installs latest otherwise; keep it equal to gcloud_version below.
          version: 591.0.0
      - name: Configure Artifact Registry
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        shell: bash
        run: |
          [[ "$GCP_REGION" =~ ^[a-z0-9-]+$ ]] || { echo "Invalid Artifact Registry region" >&2; exit 1; }
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Validate deployment inputs
        env:
          GCP_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          IMAGE_REPOSITORY: ${{ vars.GCP_ARTIFACT_IMAGE }}
        shell: bash
        run: |
          [[ "$GCP_RUNTIME_SA" =~ ^[a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com$ ]] || { echo "Invalid Cloud Run runtime service account" >&2; exit 1; }
          [[ "$IMAGE_REPOSITORY" =~ ^[^[:space:]@]+$ ]] || { echo "Invalid Artifact Registry image repository" >&2; exit 1; }
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push the Python image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ vars.GCP_ARTIFACT_IMAGE }}:${{ github.ref_name }}
      - name: Validate image digest
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ vars.GCP_ARTIFACT_IMAGE }}
        shell: bash
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Build did not return one valid sha256 image digest" >&2; exit 1; }
          printf 'ref=%s@%s\n' "$IMAGE_REPOSITORY" "$DIGEST" >> "$GITHUB_OUTPUT"
          printf 'IMAGE=%s@%s\n' "$IMAGE_REPOSITORY" "$DIGEST" >> "$GITHUB_ENV"
          printf 'SBOM=%s/sbom.cdx.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Scan image
        run: trivy --config trivy.yaml image --skip-dirs '' --platform linux/amd64 "$IMAGE"
      - name: Generate image SBOM
        run: trivy --config trivy.yaml image --skip-dirs '' --platform linux/amd64 --format cyclonedx --output "$SBOM" "$IMAGE"
      - name: Sign image
        run: cosign sign --yes "$IMAGE"
      - name: Verify image signature
        run: cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE"
      - name: Attest image SBOM
        run: cosign attest --yes --type cyclonedx --predicate "$SBOM" "$IMAGE"
      - name: Verify image attestation
        run: cosign verify-attestation --type cyclonedx --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE"
      - name: Deploy the candidate revision without traffic
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          gcloud_version: 591.0.0
          project_id: ${{ steps.auth.outputs.project_id }}
          service: ${{ vars.CLOUDRUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.image.outputs.ref }}
          env_vars: |
            HOST=0.0.0.0
            ENVIRONMENT=production
          # Required by the Python database-backed starter; adapt to the app.
          # Pin the Secret Manager version; rotation adds a version and redeploys.
          secrets: |
            DATABASE_URL=database-url:<version>
          # Serving traffic stays on the current revision; the candidate is reachable only on its tag URL.
          # --no-traffic fails on a service that does not exist yet: create it once by hand first.
          no_traffic: true
          tag: ${{ env.CANDIDATE_TAG }}
          flags: --service-account=${{ vars.GCP_RUNTIME_SA }} --invoker-iam-check --no-allow-unauthenticated
      - name: Verify private invocation
        env:
          GCP_PROJECT: ${{ steps.auth.outputs.project_id }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUDRUN_SERVICE: ${{ vars.CLOUDRUN_SERVICE }}
        run: |
          : "${GCP_PROJECT:?Missing deployment project}"
          gcloud run services describe "$CLOUDRUN_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service.json"
          gcloud run services get-iam-policy "$CLOUDRUN_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service-iam.json"
          gcloud projects get-iam-policy "$GCP_PROJECT" --format=json > "$RUNNER_TEMP/project-iam.json"
          python .github/scripts/verify-private.py "$RUNNER_TEMP" "$CLOUDRUN_SERVICE"
      - name: Resolve the candidate revision
        id: candidate
        env:
          GCP_PROJECT: ${{ steps.auth.outputs.project_id }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUDRUN_SERVICE: ${{ vars.CLOUDRUN_SERVICE }}
        run: |
          python3 - "$RUNNER_TEMP/service.json" "$CANDIDATE_TAG" > "$RUNNER_TEMP/candidate.env" <<'EOF'
          import json, re, sys
          service, tag = json.load(open(sys.argv[1])), sys.argv[2]
          routes = [entry for entry in service["status"]["traffic"] if entry.get("tag") == tag]
          if len(routes) != 1:
              sys.exit(f"Expected one {tag!r} traffic tag, found {len(routes)}")
          revision, url = routes[0]["revisionName"], routes[0]["url"]
          if not re.fullmatch(r"[a-z0-9-]+", revision) or not re.fullmatch(r"https://[a-z0-9.-]+", url):
              sys.exit("Unexpected candidate revision or URL")
          print(f"revision={revision}\nurl={url}")
          EOF
          revision="$(sed -n 's/^revision=//p' "$RUNNER_TEMP/candidate.env")"
          image="$(gcloud run revisions describe "$revision" --project "$GCP_PROJECT" --region "$GCP_REGION" --format='value(spec.containers[0].image)')"
          [[ "$image" == "$IMAGE" ]] || { echo "Candidate revision does not run the verified digest" >&2; exit 1; }
          cat "$RUNNER_TEMP/candidate.env" >> "$GITHUB_OUTPUT"
      - name: Verify the candidate on its tag URL
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        # Project task: request the health and readiness routes with an invoker identity token.
        run: mise run test:candidate
      - name: Promote the verified revision
        id: promote
        env:
          GCP_PROJECT: ${{ steps.auth.outputs.project_id }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUDRUN_SERVICE: ${{ vars.CLOUDRUN_SERVICE }}
          REVISION: ${{ steps.candidate.outputs.revision }}
        # Route traffic to the exact verified revision, never LATEST, and drop the candidate tag.
        run: >-
          gcloud run services update-traffic "$CLOUDRUN_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION"
          --to-revisions "$REVISION=100" --remove-tags "$CANDIDATE_TAG" --quiet
      - name: Remove the candidate tag after a failed or cancelled rollout
        if: (failure() || cancelled()) && steps.deploy.outcome != 'skipped' && steps.promote.outcome != 'success'
        env:
          GCP_PROJECT: ${{ steps.auth.outputs.project_id }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUDRUN_SERVICE: ${{ vars.CLOUDRUN_SERVICE }}
        run: >-
          gcloud run services update-traffic "$CLOUDRUN_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION"
          --remove-tags "$CANDIDATE_TAG" --quiet
