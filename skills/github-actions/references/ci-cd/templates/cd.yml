# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CD
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate tagged revision
    if: ${{ vars.ENABLE_DEPLOY_PYPI == 'true' || vars.ENABLE_DEPLOY_CONTAINER == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          persist-credentials: false
      - name: Install tools using mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - name: Validate the tagged revision
        run: mise run all
      - name: Verify no changes
        run: |
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test -z "$status"
      - name: Upload distributions
        if: ${{ vars.ENABLE_DEPLOY_PYPI == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-python-package:
    name: Publish Python distributions
    if: ${{ vars.ENABLE_DEPLOY_PYPI == 'true' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # Authenticate to PyPI Trusted Publishing and create attestations.
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  deploy-python-container:
    name: Publish verified container image
    if: ${{ vars.ENABLE_DEPLOY_CONTAINER == 'true' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/cd.yml@${{ github.ref }}
      ISSUER: https://token.actions.githubusercontent.com
      PLATFORMS: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write # Push the image, signatures, and SBOM attestations to GHCR.
      id-token: write # Obtain the Sigstore signing identity through OIDC.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools using mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - name: Set lower-case registry path
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: printf 'repository=ghcr.io/%s\n' "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          # Candidate tags never replace a consumer's release or latest image.
          tags: ${{ steps.image.outputs.repository }}:candidate-${{ github.sha }}
      - name: Validate image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        shell: bash
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'IMAGE=%s@%s\n' "$IMAGE_REPOSITORY" "$DIGEST" >> "$GITHUB_ENV"
          printf 'IMAGE_REPOSITORY=%s\n' "$IMAGE_REPOSITORY" >> "$GITHUB_ENV"
      - name: Resolve platform digests
        run: |
          docker buildx imagetools inspect "$IMAGE" --raw > "$RUNNER_TEMP/index.json"
          python .github/scripts/image-platforms.py "$RUNNER_TEMP/index.json" "$PLATFORMS" > "$RUNNER_TEMP/platforms.tsv"
      - name: Scan every platform
        run: |
          while IFS=$'\t' read -r platform digest; do
            trivy --config trivy.yaml image --skip-dirs '' --platform "$platform" "$IMAGE_REPOSITORY@$digest"
          done < "$RUNNER_TEMP/platforms.tsv"
      - name: Generate platform SBOMs
        run: |
          while IFS=$'\t' read -r platform digest; do
            trivy --config trivy.yaml image --skip-dirs '' --platform "$platform" --format cyclonedx --output "$RUNNER_TEMP/sbom-${platform//\//-}.cdx.json" "$IMAGE_REPOSITORY@$digest"
          done < "$RUNNER_TEMP/platforms.tsv"
      - name: Sign image
        run: cosign sign --yes "$IMAGE"
      - name: Verify image signature
        run: cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE"
      - name: Attest platform SBOMs
        run: |
          while IFS=$'\t' read -r platform digest; do
            cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/sbom-${platform//\//-}.cdx.json" "$IMAGE_REPOSITORY@$digest"
          done < "$RUNNER_TEMP/platforms.tsv"
      - name: Verify platform attestations
        run: |
          while IFS=$'\t' read -r _platform digest; do
            cosign verify-attestation --type cyclonedx --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE_REPOSITORY@$digest"
          done < "$RUNNER_TEMP/platforms.tsv"
      - name: Promote verified image
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "Invalid image release tag" >&2; exit 1; }
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_REPOSITORY:$RELEASE_TAG" --tag "$IMAGE_REPOSITORY:latest" "$IMAGE"
