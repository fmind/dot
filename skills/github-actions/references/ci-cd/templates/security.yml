# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Security
# Push CI scans only the working tree, so a secret committed earlier and later
# removed would never be seen again. This is the full-history counterpart: same
# pinned scanners, whole history, no reports to parse — a finding fails the job.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: security
  cancel-in-progress: true
jobs:
  scan:
    name: Full-history scan
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # scanners only read the checkout
      - name: Install mise system
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: true
          # Pin the mise that reads the repository's lockfile; the action installs latest otherwise.
          version: 2026.11.8
      - name: Scan complete Git history
        run: mise run check:leaks:full
      - name: Audit locked dependencies and configured checkout scans
        # Delegate to the task so the scheduled scan cannot drift from the local gate.
        run: mise run check:network
