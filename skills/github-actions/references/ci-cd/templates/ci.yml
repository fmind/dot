# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    name: Validate repository
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes back to the repository
      - name: Install mise system
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # Pin the mise that reads the repository's lockfile; the action installs latest otherwise.
          version: 2026.11.6
          cache: true
      - name: Run canonical gate
        run: mise run all
      - name: Verify no changes
        run: git status --short && [ -z "$(git status --porcelain)" ]
