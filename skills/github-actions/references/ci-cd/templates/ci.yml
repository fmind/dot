# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100 # check:leaks scans the last 100 commits (gitleaks --max-count=100); a shallower clone hides them
          persist-credentials: false # no step pushes back to the repository
      - name: Install mise system
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # Pin the mise that reads the repository's lockfile; the action installs latest otherwise.
          version: 2026.10.2
          cache: true
      - name: Run canonical gate
        run: mise run all
      - name: Verify no changes
        run: |
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test -z "$status"
