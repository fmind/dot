<!-- Docs: https://developer.mozilla.org/en-US/docs/Web/SVG -->
<!--
Fmind illustration starter: copy it beside the page, rename it, then replace every example label.
Grid: 960 wide, 1px card inset; columns at x=32 (inputs, 224 wide), 320 (system, 320 wide) and 704 (outputs, 224 wide);
rows step by 42 (34px chip + 8px gap); flows use the 64px gutters between columns.
Classes: label = uppercase heading; chip = neutral item; box = the system boundary; tile = a named part
(code title + muted subtitle); config = configuration or caution; err = failure; step = numbered badge;
flow = primary arrow; muted = secondary note.
Brand: ~/.agents/DESIGN.md roles (https://github.com/fmind/theme/blob/main/DESIGN.md) plus the light #DADCE0 card border; every color
lives in <style>. For a customer, swap its hex values and font names only and keep text contrast at 4.5:1
or more on its actual fill.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Inputs become outputs through one system</title>
<desc id="desc">Replace with the full prose equivalent: what enters on the left, what the system holds in the middle, what leaves on the right, and what each numbered step does.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 L10 5 L0 10 Z"/></marker>
<style>
text { font-family: "Google Sans", "Google Sans Text", Roboto, "Segoe UI", Helvetica, Arial, sans-serif; fill: #202124; }
.code { font-family: "Google Sans Code", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
.card { fill: #FFFFFF; stroke: #DADCE0; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #595D62; }
.chip { fill: #F1F3F4; }
.chip-text { font-size: 14px; }
.muted { font-size: 12.5px; fill: #595D62; }
.box { fill: #FFFFFF; stroke: #174EA6; stroke-width: 2; }
.tile { fill: #D2E3FC; }
.tile-title { font-size: 14px; font-weight: 700; fill: #174EA6; }
.config { fill: #FEEFC3; stroke: #E37400; }
.err { fill: #FAD2CF; stroke: #EA4335; }
.err-text { font-weight: 700; fill: #A50E0E; }
.step { fill: #174EA6; }
.step-text { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
.flow { fill: none; stroke: #174EA6; stroke-width: 2; }
.arrowhead { fill: #174EA6; }
.mask { fill: #FFFFFF; }
</style>
</defs>
<!-- An opaque light card keeps the drawing legible on dark README and site themes. -->
<rect class="card" x="1" y="1" width="958" height="418" rx="16"/>

<!-- Inputs -->
<text class="label" x="144" y="44" text-anchor="middle">INPUTS</text>
<g text-anchor="middle">
<rect class="chip" x="32" y="64" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="86">First input · source</text>
<rect class="chip" x="32" y="106" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="128">Second input · source</text>
<rect class="chip" x="32" y="148" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="170">Third input · source</text>
<rect class="chip" x="32" y="190" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="212">Fourth input · source</text>
</g>

<!-- 1 Enter -->
<line class="flow" x1="262" y1="144" x2="314" y2="144" marker-end="url(#arrow)"/>
<circle class="step" cx="288" cy="120" r="11"/><text class="step-text" x="288" y="124.5" text-anchor="middle">1</text>
<text class="muted" x="288" y="170" text-anchor="middle">collect</text>

<!-- System -->
<text class="label" x="480" y="44" text-anchor="middle">THE SYSTEM</text>
<rect class="box" x="320" y="60" width="320" height="276" rx="14"/>
<rect class="config" x="340" y="78" width="280" height="56" rx="10"/>
<text class="code" x="480" y="101" text-anchor="middle" style="font-size:15px;font-weight:700">config.yaml</text>
<text class="muted" x="480" y="122" text-anchor="middle">what the system declares</text>
<g text-anchor="middle">
<rect class="tile" x="340" y="148" width="134" height="54" rx="10"/><text class="code tile-title" x="407" y="170">part_a/</text><text class="muted" x="407" y="190">what it holds</text>
<rect class="tile" x="486" y="148" width="134" height="54" rx="10"/><text class="code tile-title" x="553" y="170">part_b/</text><text class="muted" x="553" y="190">what it holds</text>
<rect class="err" x="340" y="216" width="280" height="54" rx="10"/><text class="err-text" x="480" y="238" style="font-size:14px">A boundary or failure</text><text class="muted" x="480" y="258">what goes wrong without it</text>
</g>
<text class="muted" x="480" y="314" text-anchor="middle">one short property · another property</text>

<!-- 2 Deliver -->
<line class="flow" x1="644" y1="144" x2="700" y2="144" marker-end="url(#arrow)"/>
<circle class="step" cx="672" cy="120" r="11"/><text class="step-text" x="672" y="124.5" text-anchor="middle">2</text>
<text class="muted" x="672" y="170" text-anchor="middle">deliver</text>

<!-- Outputs -->
<text class="label" x="816" y="44" text-anchor="middle">OUTPUTS</text>
<g text-anchor="middle">
<rect class="chip" x="704" y="106" width="224" height="34" rx="17"/><text class="chip-text" x="816" y="128">First outcome</text>
<rect class="chip" x="704" y="148" width="224" height="34" rx="17"/><text class="chip-text" x="816" y="170">Second outcome</text>
</g>

<!-- 3 Feed back: mask the path behind its caption with a canvas-colored rectangle. -->
<path class="flow" d="M816 190 V380 H144 V232" marker-end="url(#arrow)"/>
<rect class="mask" x="300" y="368" width="360" height="24"/>
<circle class="step" cx="316" cy="380" r="11"/><text class="step-text" x="316" y="384.5" text-anchor="middle">3</text>
<text x="336" y="385" style="font-size:14px">feed what was learned back to the inputs</text>
</svg>
