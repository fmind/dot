# Docs: https://mise.jdx.dev/configuration.html
# Merge into the repository's existing task graph; do not replace application gates.
[settings.task]
# Keep build warnings and errors; MISE_TASK_QUIET=false restores command echoes.
quiet = true

[tools]
# Scaffold selectors: replace with exact pins; CI installs only what this table declares.
dprint = "latest"
uv = "latest"

[tasks.install]
run = "uv sync --locked"

[tasks.format]
depends = ["format:dprint"]

[tasks."format:dprint"]
# Lefthook appends {staged_files}; the flag keeps an empty list from exiting 14.
run = "dprint fmt --allow-no-files"

[tasks."check:format"]
run = "dprint check"

# Strict builds fail on broken links, anchors, snippets, and plugin warnings; exit status 1 on any issue.
[tasks."build:docs"]
run = "uv run --locked zensical build --clean --strict"

[tasks."serve:docs"]
run = "uv run --locked zensical serve"

[tasks.check]
# Course repositories also add their lab tests here; a docs build is not a lab test.
depends = ["check:local", "check:network"]

[tasks."check:local"]
# Pre-commit stays offline.
depends = ["check:format"]

[tasks."check:network"]
# The privacy plugin downloads fonts and Mermaid on every clean build, so pre-push and CI run it.
depends = ["build:docs"]
