# Docs: https://mise.jdx.dev/configuration.html

[settings]
lockfile = true

[settings.task]
run_auto_install = false

[tools]
dprint = "latest"
gitleaks = "latest"
uv = "latest"

[tasks.all]
alias = "a"
description = "Format, check, test, and build the project"
run = ["mise run format", "mise run check", "mise run test", "mise run build"]

[tasks.build]
alias = "b"
description = "Build Python distribution artifacts"
run = "uv build"

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = [
  "check:format",
  "check:leaks",
  "check:lint",
  "check:types",
  "check:vuln",
]

[tasks."check:format"]
alias = "cf"
description = "Check formatting, project metadata, and lockfile"
run = [
  "uv run --locked validate-pyproject pyproject.toml",
  "uv run --locked ruff format --check",
  "dprint check",
]

[tasks."check:leaks"]
alias = "cs"
description = "Scan the working tree and recent commits for leaked secrets"
depends = ["check:leaks:tree", "check:leaks:history"]

[tasks."check:leaks:tree"]
description = "Scan working-tree files, including untracked files"
run = "gitleaks dir . --redact=100 --verbose"

[tasks."check:leaks:history"]
description = "Scan the latest 100 commits reachable from HEAD"
# An unborn HEAD has no history; check:leaks:tree still scans its files.
run = 'gitleaks git --redact=100 --log-opts="--max-count=100 --ignore-missing HEAD --" --verbose'

[tasks."check:leaks:staged"]
description = "Scan only staged changes before committing"
run = "gitleaks git --redact=100 --staged --verbose"

[tasks."check:lint"]
alias = "cl"
description = "Lint Python sources (ruff)"
run = "uv run --locked ruff check"

[tasks."check:types"]
alias = "ct"
description = "Type-check Python sources (ty)"
run = "uv run --locked ty check"

[tasks."check:vuln"]
alias = "cv"
description = "Scan dependencies for vulnerabilities (uv audit)"
run = "uv audit --preview-features audit-command --locked"

[tasks.clean]
alias = "n"
description = "Remove build artifacts and coverage files"
run = "rm -rf .cache .pytest_cache .ruff_cache .coverage htmlcov dist"

[tasks.coverage]
alias = "v"
description = "Write an HTML coverage report"
depends = ["test"]
run = "uv run coverage html"

[tasks.docs]
alias = "d"
description = "Generate HTML docs (pdoc)"
run = "uv run pdoc -o .cache/docs <package>"

[tasks.format]
alias = "f"
description = "Format all sources and documents"
depends = ["format:dprint", "format:python"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, YAML with dprint"
run = "dprint fmt --allow-no-files"

[tasks."format:python"]
description = "Format Python sources and imports (ruff)"
run = ["mise run format:imports", "mise run format:ruff"]

[tasks."format:imports"]
description = "Sort Python imports"
run = "uv run ruff check --select=I --fix --force-exclude"

[tasks."format:ruff"]
description = "Format Python sources"
run = "uv run ruff format --force-exclude"

[tasks.install]
alias = "i"
description = "Install development dependencies"
run = ["uv sync", "uv run lefthook install"]

[tasks.publish]
alias = "p"
description = "Publish distribution artifacts to PyPI"
run = "uv publish"

[tasks.test]
alias = "t"
description = "Run offline tests with the coverage gate"
run = 'uv run --locked pytest -m "not integration" --cov'

[tasks."test:integration"]
alias = "ti"
description = "Run opt-in Docker-backed integration tests"
run = "uv run --locked pytest -m integration"

[tasks."test:watch"]
alias = "tw"
description = "Run offline tests in watch mode"
run = 'uv run pytest-watcher . -m "not integration"'

[tasks.upgrade]
alias = "u"
description = "Upgrade dependencies to latest compatible versions"
run = "uv sync --upgrade"

[tasks.watch]
alias = "w"
description = "Re-run offline tests on source changes"
run = "mise run test:watch"
