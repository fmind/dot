# Docs: https://mise.jdx.dev/configuration.html

# Fail early on a mise older than the one CI pins (keep equal to the workflow `version:`).
min_version = "2026.10.18"

[settings]
lockfile = true

[settings.task]
run_auto_install = false
# Preserve child output; MISE_TASK_QUIET=false restores execution messages.
quiet = true

[tools]
# Scaffold selectors: replace with exact baseline pins and add Python before installation.
betterleaks = "latest"
dprint = "latest"
lefthook = "latest"
uv = "latest"

[tasks.all]
alias = "a"
description = "Check, test, and build the project and its docs without rewriting source files"
run = ["mise run check", "mise run test", "mise run build"]

[tasks.build]
alias = "b"
description = "Build the Python distribution and the documentation site"
depends = ["build:docs", "build:package"]

[tasks."build:docs"]
alias = "bd"
# Strict: broken links, anchors, and docstring cross-references fail the build.
description = "Build the documentation site with its API reference (Zensical)"
run = "uv run --locked zensical build --clean --strict"

[tasks."build:package"]
alias = "bp"
description = "Build Python distribution artifacts (wheel and sdist)"
run = "uv build --clear"

[tasks."serve:docs"]
description = "Preview the documentation site"
run = "uv run --locked zensical serve"

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = ["check:local", "check:network"]

[tasks."check:local"]
description = "Run the static checks that need no network (pre-commit)"
depends = ["check:deps", "check:format", "check:leaks", "check:lint", "check:types"]

[tasks."check:network"]
description = "Run the checks that download vulnerability data (pre-push)"
depends = ["check:vuln"]

[tasks."check:deps"]
alias = "cd"
description = "Find missing, unused, transitive, and misplaced dependencies (deptry)"
run = "uv run --locked deptry ."

[tasks."check:format"]
alias = "cf"
description = "Check formatting, project metadata, and lockfile"
run = [
  "uv run --locked validate-pyproject pyproject.toml",
  "uv run --locked ruff format --check",
  "dprint check",
]

[tasks."check:leaks"]
alias = "cs"
description = "Scan working-tree files, including untracked files, for leaked secrets"
run = "betterleaks dir . --redact=100 --verbose --no-banner"

[tasks."check:leaks:full"]
description = "Scan the complete Git history (weekly in security.yml; needs a full clone)"
run = "betterleaks git --redact=100 --verbose --no-banner"

[tasks."check:lint"]
alias = "cl"
description = "Lint Python sources (ruff)"
run = "uv run --locked ruff check"

[tasks."check:types"]
alias = "ct"
description = "Type-check Python sources (ty)"
run = "uv run --locked ty check"

[tasks."check:vuln"]
alias = "cv"
description = "Scan dependencies for vulnerabilities (uv audit)"
run = "uv audit --preview-features audit-command --locked"

[tasks.clean]
alias = "n"
description = "Remove build artifacts and coverage files"
run = "rm -rf .cache .pytest_cache .ruff_cache .coverage .coverage.* htmlcov dist site"

[tasks.coverage]
alias = "v"
description = "Write an HTML coverage report"
depends = ["test"]
run = "uv run --locked coverage html"

[tasks."report:coverage"]
description = "Show per-file coverage from the last test run without rerunning tests"
run = "uv run --locked coverage report"

[tasks.format]
alias = "f"
description = "Format all sources and documents"
run = ["mise run format:imports", "mise run format:python", "mise run format:dprint"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, YAML with dprint"
run = "dprint fmt --allow-no-files"

[tasks."format:imports"]
description = "Sort Python imports"
run = "uv run --locked ruff check --select=I --fix --force-exclude"

[tasks."format:python"]
description = "Format Python sources"
run = "uv run --locked ruff format --force-exclude"

[tasks.install]
alias = "i"
description = "Install development dependencies, refusing packages with known malware advisories"
# Preview OSV malware lookup (about 1 s, needs network); routine `uv run` calls skip it.
run = ["UV_MALWARE_CHECK=1 uv sync --locked --preview-features malware-check", "lefthook install"]

[tasks.test]
alias = "t"
description = "Run offline tests with the coverage gate"
# The positive fail_under in pyproject.toml preserves the total and coverage gate.
run = 'uv run --locked pytest -q -m "not integration" --cov --cov-report='

[tasks."test:integration"]
alias = "ti"
description = "Run opt-in Docker-backed integration tests"
run = "uv run --locked pytest -q -m integration --force-enable-socket --timeout=600"

[tasks.upgrade]
alias = "u"
description = "Upgrade dependencies to latest compatible versions, refusing known malware"
run = "UV_MALWARE_CHECK=1 uv sync --upgrade --preview-features malware-check"

[tasks.watch]
alias = "w"
description = "Re-run offline tests on source changes"
run = 'uv run --locked pytest-watcher . -q -m "not integration"'
