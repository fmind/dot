# Docs: https://lefthook.dev/configuration/

pre-commit:
  parallel: false
  commands:
    format:dprint:
      glob: "*.{json,md,toml,yaml,yml}"
      priority: 10
      run: mise run format:dprint {staged_files}
      stage_fixed: true
    format:imports:
      glob: "*.py"
      priority: 10
      run: mise run format:imports {staged_files}
      stage_fixed: true
    format:ruff:
      glob: "*.py"
      priority: 15
      run: mise run format:ruff {staged_files}
      stage_fixed: true
    check:leaks:staged:
      priority: 20
      run: mise run check:leaks:staged
    check:
      priority: 30
      run: mise run check
pre-push:
  commands:
    test:
      run: mise run test
