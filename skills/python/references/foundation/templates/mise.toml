# :schema https://mise.jdx.dev/schema/mise.json
# Docs: https://mise.jdx.dev/configuration.html

# Fail early on a mise older than the one CI pins (keep equal to the workflow `version:`).
min_version = "2026.11.12"

[settings]
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]
minimum_release_age = "0d"

# Uncomment after running `mise lock` to enforce locked installs locally and in CI.
# [tool_config]
# locked = true

[settings.task]
run_auto_install = false
# Preserve child output; MISE_TASK_QUIET=false restores execution messages.
quiet = true

[task_config]
dir = "{{config_root}}"

[env]
# Opt out of OpenSpec's PostHog usage telemetry (remove if opting out of OpenSpec).
OPENSPEC_TELEMETRY = "0"

[tools]
# Scaffold selectors: replace with exact baseline pins before locking and installation.
betterleaks = "latest"
dprint = "latest"
git-cliff = "latest"
jactionlint = "latest"
lefthook = "latest"
lychee = "latest"
# Default to 3.14; bump to 3.15 for pure-Python packages whose deps all support it.
python = "3.14"
shellcheck = "latest"
typos = "latest"
uv = "latest"

[tools."github:Fission-AI/OpenSpec"]
# Standalone OpenSpec CLI (glibc on Linux; remove with check:specs if opting out).
version = "latest"

[tools."github:Fission-AI/OpenSpec".platforms]
linux-arm64 = { asset_pattern = "openspec-linux-arm64.tar.gz" }
linux-x64 = { asset_pattern = "openspec-linux-x64.tar.gz" }
macos-arm64 = { asset_pattern = "openspec-darwin-arm64.tar.gz" }

[tasks.all]
alias = "a"
description = "Check, test, and build the project without rewriting source files"
run = ["mise run check", "mise run test", "mise run build"]

[tasks.build]
alias = "b"
description = "Build Python distribution artifacts (wheel and sdist)"
run = "uv build --clear --no-sources"

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = ["check:local", "check:network"]

[tasks."check:local"]
description = "Run the static checks that need no network (pre-commit)"
depends = [
  "check:actions",
  "check:deps",
  "check:format",
  "check:leaks",
  "check:links",
  "check:lint",
  "check:specs",
  "check:tasks",
  "check:types",
  "check:typos",
]

[tasks."check:actions"]
alias = "ca"
description = "Lint GitHub Actions workflows and shell snippets offline (jactionlint + shellcheck)"
run = "jactionlint --profile pedantic"

[tasks."check:actions:online"]
description = "Audit GitHub Actions workflows with online checks"
run = "jactionlint --online=strict --strict-exit"

[tasks."check:network"]
description = "Run the checks that download vulnerability data (pre-push)"
depends = ["check:vuln"]

[tasks."check:deps"]
alias = "cd"
description = "Find missing, unused, transitive, and misplaced dependencies (deptry)"
run = "uv run --locked deptry ."

[tasks."check:format"]
alias = "cf"
description = "Check formatting, project metadata, and lockfile"
run = [
  "uv run --locked validate-pyproject pyproject.toml",
  "uv run --locked ruff format --check",
  "uv lock --check",
  "dprint check",
]

[tasks."check:leaks"]
alias = "cs"
description = "Scan working-tree files, including untracked files, for leaked secrets"
# betterleaks 1.10+ loads .betterleaks.toml only when named explicitly.
run = "betterleaks dir . --config .betterleaks.toml --redact=100 --verbose --no-banner"

[tasks."check:leaks:staged"]
description = "Scan staged Git changes for leaked secrets"
run = "betterleaks git --staged --config .betterleaks.toml --redact=100 --verbose --no-banner"

[tasks."check:leaks:full"]
description = "Scan the complete Git history (weekly in security.yml; needs a full clone)"
run = "betterleaks git --config .betterleaks.toml --redact=100 --verbose --no-banner"

[tasks."check:links"]
description = "Check offline Markdown links and fragments (lychee)"
run = "lychee --offline --include-fragments --no-progress --exclude-path openspec/changes/archive --extensions md ."

[tasks."check:lint"]
alias = "cl"
description = "Lint Python sources (ruff)"
run = "uv run --locked ruff check"

[tasks."check:specs"]
description = "Validate OpenSpec specs, active changes, and archived tasks strictly"
run = [
  "openspec validate --all --strict --no-interactive",
  "openspec validate --archived --strict --no-interactive",
]

[tasks."check:tasks"]
description = "Validate repository task and Git hook definitions"
run = ["mise tasks validate", "lefthook validate"]

[tasks."check:types"]
alias = "ct"
description = "Type-check Python sources (ty)"
run = "uv run --locked ty check"

[tasks."check:typos"]
description = "Check spelling across documentation and sources (typos)"
run = "typos"

[tasks."check:vuln"]
alias = "cv"
description = "Scan dependencies for vulnerabilities (uv audit)"
run = "uv audit --preview-features audit-command --locked"

[tasks.clean]
alias = "n"
description = "Remove build artifacts and coverage files"
run = "rm -rf .cache .pytest_cache .ruff_cache .ty_cache .coverage .coverage.* htmlcov build dist site"

[tasks.coverage]
alias = "v"
description = "Write an HTML coverage report"
depends = ["test"]
run = "uv run --locked coverage html"

[tasks."report:coverage"]
description = "Show per-file coverage from the last test run without rerunning tests"
run = "uv run --locked coverage report"

[tasks.format]
alias = "f"
description = "Format all sources and documents"
depends = ["format:dprint", "format:python"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, YAML with dprint"
run = "dprint fmt --allow-no-files"

[tasks."format:python"]
description = "Sort imports and format Python sources, or only the given files"
usage = 'arg "[files]..." default="."'
run = '''
set -eu
eval "set -- ${usage_files:-}"
uv run --locked ruff check --select=I --fix --force-exclude -- "$@"
uv run --locked ruff format --force-exclude -- "$@"
'''

[tasks.install]
alias = "i"
description = "Install development dependencies, refusing packages with known malware advisories"
# Preview OSV malware lookup (about 1 s, needs network); routine `uv run` calls skip it.
run = ["UV_MALWARE_CHECK=1 uv sync --locked --preview-features malware-check", "lefthook install"]

[tasks.test]
alias = "t"
description = "Run offline tests with the coverage gate"
env.TZ = "UTC"
# The positive fail_under in pyproject.toml preserves the total and coverage gate.
run = 'uv run --locked pytest -q -m "not integration and not e2e" --cov --cov-report='

[tasks.upgrade]
alias = "u"
description = "Upgrade dependencies to latest compatible versions, refusing known malware"
run = "UV_MALWARE_CHECK=1 uv sync --upgrade --preview-features malware-check"
