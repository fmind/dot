# Docs: https://copier.readthedocs.io/en/stable/configuring/
_min_copier_version: "9.19.1"
_subdirectory: template
_envops:
  undefined: jinja2.StrictUndefined

slug:
  type: str
  help: Lowercase hyphenated repository and package distribution slug.
  validator: "{% if not slug %}slug is required{% endif %}"

package:
  type: str
  help: Underscored Python import package name.
  default: "{{ slug.replace('-', '_') }}"
  validator: "{% if not package %}package is required{% endif %}"

owner:
  type: str
  help: GitHub owner or organization slug.
  default: fmind

holder:
  type: str
  help: Copyright holder name for LICENSE and package metadata.

description:
  type: str
  help: One-sentence project summary.
