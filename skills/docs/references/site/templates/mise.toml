# :schema https://mise.jdx.dev/schema/mise.json
# Docs: https://mise.jdx.dev/configuration.html
# Merge into the repository's existing task graph; do not replace application gates.

# Fail early on a mise older than the one CI pins (keep equal to the workflow `version:`).
min_version = "2026.11.12"

[settings]
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]
minimum_release_age = "0d"

# Uncomment after running `mise lock` to enforce locked tool installs:
# [tool_config]
# locked = true

[settings.task]
run_auto_install = false
# Keep build warnings and errors; MISE_TASK_QUIET=false restores command echoes.
quiet = true

[task_config]
dir = "{{config_root}}"

[env]
# Opt out of OpenSpec's PostHog usage telemetry (remove if opting out of OpenSpec).
OPENSPEC_TELEMETRY = "0"

[tools]
# Scaffold selectors: replace with exact pins; CI installs only what this table declares.
betterleaks = "latest"
dprint = "latest"
git-cliff = "latest"
jactionlint = "latest"
lefthook = "latest"
lychee = "latest"
shellcheck = "latest"
typos = "latest"
uv = "latest"

[tools."github:Fission-AI/OpenSpec"]
# Standalone OpenSpec CLI (glibc on Linux; remove with check:specs if opting out).
version = "latest"

[tools."github:Fission-AI/OpenSpec".platforms]
linux-arm64 = { asset_pattern = "openspec-linux-arm64.tar.gz" }
linux-x64 = { asset_pattern = "openspec-linux-x64.tar.gz" }
macos-arm64 = { asset_pattern = "openspec-darwin-arm64.tar.gz" }

[tasks.all]
alias = "a"
description = "Check formatting, secrets, vulnerabilities, and strict docs build without rewriting files"
# check already builds the docs through check:network; a second build would repeat its downloads.
run = "mise run check"

[tasks.install]
alias = "i"
description = "Install documentation dependencies and git hooks, refusing known malware advisories"
run = ["UV_MALWARE_CHECK=1 uv sync --locked --preview-features malware-check", "lefthook install"]

[tasks.format]
alias = "f"
description = "Format Markdown and configuration files"
depends = ["format:dprint"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, YAML with dprint"
# Lefthook appends {staged_files}; the flag keeps an empty list from exiting 14.
run = "dprint fmt --allow-no-files"

[tasks."check:format"]
alias = "cf"
description = "Check Markdown, lockfile, and configuration formatting"
run = ["uv lock --check", "dprint check"]

[tasks."check:leaks"]
alias = "cs"
description = "Scan working-tree files, including untracked files, for leaked secrets"
# betterleaks 1.10+ loads .betterleaks.toml only when named explicitly.
run = "betterleaks dir . --config .betterleaks.toml --redact=100 --verbose --no-banner"

[tasks."check:leaks:staged"]
description = "Scan staged Git changes for leaked secrets"
run = "betterleaks git --staged --config .betterleaks.toml --redact=100 --verbose --no-banner"

[tasks."check:leaks:full"]
description = "Scan the complete Git history (weekly in security.yml; needs a full clone)"
run = "betterleaks git --config .betterleaks.toml --redact=100 --verbose --no-banner"

[tasks."check:links"]
description = "Check offline Markdown links and fragments (lychee)"
run = "lychee --offline --include-fragments --no-progress --exclude-path openspec/changes/archive --extensions md ."

[tasks."check:actions"]
alias = "ca"
description = "Lint GitHub Actions workflows and shell snippets offline (jactionlint + shellcheck)"
run = "jactionlint --profile pedantic"

[tasks."check:actions:online"]
description = "Audit GitHub Actions workflows with online checks"
run = "jactionlint --online=strict --strict-exit"

[tasks."check:specs"]
description = "Validate OpenSpec specs, active changes, and archived tasks strictly"
run = [
  "openspec validate --all --strict --no-interactive",
  "openspec validate --archived --strict --no-interactive",
]

[tasks."check:tasks"]
description = "Validate repository task and Git hook definitions"
run = ["mise tasks validate", "lefthook validate"]

[tasks."check:typos"]
description = "Check spelling across documentation and sources (typos)"
run = "typos"

[tasks."check:vuln"]
alias = "cv"
description = "Scan documentation dependencies for vulnerabilities (uv audit)"
run = "uv audit --preview-features audit-command --locked"

[tasks.build]
alias = "b"
description = "Build the documentation site"
run = "mise run build:docs"

# Strict builds fail on broken links, anchors, snippets, and plugin warnings; exit status 1 on any issue.
[tasks."build:docs"]
alias = "bd"
description = "Build the documentation site strictly (Zensical)"
run = "uv run --locked zensical build --clean --strict"

[tasks."serve:docs"]
description = "Preview the documentation site (override port via PORT=8001)"
run = "uv run --locked zensical serve -a 127.0.0.1:${PORT:-8000}"

[tasks.check]
alias = "c"
description = "Run all static and documentation checks"
# Course repositories also add their lab tests here; a docs build is not a lab test.
depends = ["check:local", "check:network"]

[tasks."check:local"]
description = "Run offline checks (pre-commit)"
depends = ["check:actions", "check:format", "check:leaks", "check:links", "check:specs", "check:tasks", "check:typos"]

[tasks."check:network"]
description = "Audit locked dependencies and build the site with vendored font/Mermaid assets (pre-push)"
depends = ["build:docs", "check:vuln"]
