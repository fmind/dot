# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json
# Docs: https://lefthook.dev/configuration/

glob_matcher: doublestar
output: [summary, failure, execution_out]
# Jobs run in list order: formatters fix and restage only the staged files, then checks validate the tree.
pre-commit:
  jobs:
    - name: format docs and config
      glob: "**/*.{json,jsonc,md,toml,yaml,yml}"
      run: mise run format:dprint -- {staged_files}
      stage_fixed: true
    - name: check leaks (staged)
      run: mise run check:leaks:staged
    - name: check
      run: mise run check:local
pre-push:
  parallel: true
  jobs:
    # Vulnerability databases and site builds with vendored assets need the network; CI runs both through `check`.
    - name: check network and build docs
      run: mise run check:network
