# :schema https://mise.jdx.dev/schema/mise.json
# Docs: https://mise.jdx.dev/configuration.html

# Fail early on a mise older than the one CI pins (keep equal to the workflow `version:`).
min_version = "2026.11.12"

[settings]
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]
minimum_release_age = "0d"
# [tool_config]
# locked = true

[settings.task]
run_auto_install = false
# Preserve plan and diagnostic output; MISE_TASK_QUIET=false restores command echoes.
quiet = true

[task_config]
dir = "{{config_root}}"

[env]
# Opt out of OpenSpec's PostHog usage telemetry (remove if opting out of OpenSpec).
OPENSPEC_TELEMETRY = "0"
# Keep CI and hook logs free of download bars, and ignore any global Trivy config.
TRIVY_CONFIG = "trivy.yaml"
TRIVY_NO_PROGRESS = "true"

[tools]
betterleaks = "latest"
dprint = "latest"
git-cliff = "latest"
jactionlint = "latest"
lefthook = "latest"
lychee = "latest"
opentofu = "latest"
shellcheck = "latest"
terraform-docs = "latest"
tflint = "latest"
trivy = "latest"
typos = "latest"

[tools."github:Fission-AI/OpenSpec"]
# Standalone OpenSpec CLI (glibc on Linux; remove with check:specs if opting out).
version = "latest"

[tools."github:Fission-AI/OpenSpec".platforms]
linux-arm64 = { asset_pattern = "openspec-linux-arm64.tar.gz" }
linux-x64 = { asset_pattern = "openspec-linux-x64.tar.gz" }
macos-arm64 = { asset_pattern = "openspec-darwin-arm64.tar.gz" }

[tasks.all]
alias = "a"
description = "Run the full gate (check, test, build)"
run = ["mise run check", "mise run test", "mise run build"]

[tasks.build]
alias = "b"
description = "Generate module documentation without accessing cloud resources"
run = "mise run build:docs"

[tasks.plan]
description = "Create a plan for the explicitly selected backend, workspace, and cloud target"
run = ["mkdir -p tmp", "tofu plan -out=tmp/plan.tfplan"]

[tasks."build:docs"]
alias = "bd"
description = "Inject module documentation into README.md (terraform-docs)"
# terraform-docs writes unaligned tables; dprint realigns them so check:format and the CI clean-tree check pass.
run = ["terraform-docs .", "dprint fmt README.md"]

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = ["check:local", "check:network"]

[tasks."check:local"]
description = "Run the static checks that need no network (pre-commit)"
depends = [
  "check:actions",
  "check:format",
  "check:leaks",
  "check:links",
  "check:lint",
  "check:specs",
  "check:tasks",
  "check:typos",
  "check:validate",
]

[tasks."check:actions"]
alias = "ca"
description = "Lint GitHub Actions workflows and shell snippets offline (jactionlint + shellcheck)"
run = "jactionlint --profile pedantic"

[tasks."check:actions:online"]
description = "Audit GitHub Actions workflows with online checks"
run = "jactionlint --online=strict --strict-exit"

[tasks."check:network"]
description = "Run the checks that download policy data (pre-push)"
depends = ["check:scan"]

[tasks."check:format"]
alias = "cf"
description = "Check HCL and config formatting (tofu fmt + dprint)"
run = ["tofu fmt -check -recursive", "dprint check"]

[tasks."check:leaks"]
alias = "cs"
description = "Scan working-tree files, including untracked files, for leaked secrets"
# betterleaks 1.10+ loads .betterleaks.toml only when named explicitly.
run = "betterleaks dir . --config .betterleaks.toml --redact=100 --verbose --no-banner"

[tasks."check:leaks:staged"]
description = "Scan staged Git changes for leaked secrets"
run = "betterleaks git --staged --config .betterleaks.toml --redact=100 --verbose --no-banner"

[tasks."check:leaks:full"]
description = "Scan the complete Git history (weekly in security.yml; needs a full clone)"
run = "betterleaks git --config .betterleaks.toml --redact=100 --verbose --no-banner"

[tasks."check:links"]
description = "Check offline Markdown links and fragments (lychee)"
run = "lychee --offline --include-fragments --no-progress --exclude-path openspec/changes/archive --extensions md ."

[tasks."check:lint"]
alias = "cl"
description = "Lint HCL with provider-aware rules (tflint)"
run = "tflint --recursive"

[tasks."check:scan"]
alias = "cn"
description = "Scan IaC, dependencies, and licenses (trivy)"
run = "trivy --config trivy.yaml fs --tf-vars terraform.example.tfvars ."

[tasks."check:specs"]
description = "Validate OpenSpec specs, active changes, and archived tasks strictly"
run = [
  "openspec validate --all --strict --no-interactive",
  "openspec validate --archived --strict --no-interactive",
]

[tasks."check:tasks"]
description = "Validate repository task and Git hook definitions"
run = ["mise tasks validate", "lefthook validate"]

[tasks."check:typos"]
description = "Check spelling across documentation and sources (typos)"
run = "typos"

[tasks."check:validate"]
description = "Validate configuration syntax and internal consistency"
run = "tofu validate"

[tasks.format]
alias = "f"
description = "Format HCL and configuration files"
depends = ["format:tofu", "format:dprint"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, YAML with dprint"
run = "dprint fmt --allow-no-files"

# Split from format:dprint because tofu and dprint format different file types.
[tasks."format:tofu"]
description = "Format HCL sources (tofu fmt)"
run = "tofu fmt -recursive"

[tasks.install]
alias = "i"
description = "Install providers, lint rulesets, and git hooks"
depends = ["install:hooks", "install:init", "install:lint"]

[tasks."install:hooks"]
description = "Install Git hooks using Lefthook"
run = "lefthook install"

[tasks."install:init"]
description = "Download providers and initialize the backend (tofu init)"
run = "tofu init"

[tasks."install:lint"]
description = "Install tflint plugin rulesets pinned in .tflint.hcl"
run = "tflint --init"

[tasks.test]
alias = "t"
description = "Run native OpenTofu tests (tests/*.tftest.hcl)"
run = "tofu test"
