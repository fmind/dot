# Docs: https://lefthook.dev/configuration/

output: [summary, failure, execution_out] # quiet commits: no version banner, no successful-step noise
pre-commit:
  parallel: false
  commands:
    format:dprint:
      glob: "*.{json,md,toml,yaml,yml}"
      priority: 10
      run: mise run format:dprint {staged_files}
      stage_fixed: true
    format:tofu:
      glob: "*.{tf,tfvars,tftest.hcl}"
      priority: 10
      run: mise run format:tofu {staged_files}
      stage_fixed: true
    check:
      priority: 30
      run: mise run check
pre-push:
  commands:
    test:
      run: mise run test
