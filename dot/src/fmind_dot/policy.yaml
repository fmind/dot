  - vale

completions:
  plain:
    - betterleaks
    - chezmoi
    - copilot
    - cosign
    - databricks
    - dot
    - genie
    - lefthook
    - mise
    - trivy
  packages:
    fastfetch: github:fastfetch-cli/fastfetch
    git-cliff: git-cliff
    hurl: hurl
    hurlfmt: hurl
    hyperfine: hyperfine
    lsd: lsd
    ya: yazi
    yazi: yazi
    zoxide: zoxide
  env:
    colab: _COLAB_COMPLETE=source_fish
    hf: _HF_COMPLETE=fish_source
    marimo: _MARIMO_COMPLETE=fish_source
  commands:
    completions_fish:
      - ast-grep
      - doggo
      - dprint
      - pup
      - starship
      - typst
    generate_shell_completion_fish:
      - ruff
      - ty
      - uv
    generate_complete_fish:
      - lychee
      - rg
      - xh
    custom:
      atuin:
        - atuin
        - gen-completions
        - --shell
        - fish
      bat:
        - bat
        - --completion
        - fish
      cf:
        - cf
        - complete
        - fish
      delta:
        - delta
        - --generate-completion
        - fish
      fd:
        - fd
        - --gen-completions
        - fish
      gh:
        - gh
        - completion
        - -s
        - fish
      git-lfs:
        - git
        - lfs
        - completion
        - fish
      jactionlint:
        - jactionlint
        - --completion=fish
      lazygit:
        - lazygit
        - completion
        - fish
      opencode:
        - opencode
        - --completions
        - fish
      tree-sitter:
        - tree-sitter
        - complete
        - --shell
        - fish
      usage:
        - usage
        - --completions
        - fish
      uvx:
        - uvx
        - --generate-shell-completion
        - fish
      yq:
        - yq
        - shell-completion
        - fish
      zellij:
        - zellij
        - setup
        - --generate-completion
        - fish
