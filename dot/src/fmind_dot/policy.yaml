github:
  scopes:
    - gist
    - notifications
    - project
    - read:audit_log
    - read:discussion
    - read:enterprise
    - read:gpg_key
    - read:org
    - read:packages
    - read:public_key
    - read:ssh_signing_key
    - read:user
    - repo
    - user:email
    - workflow
  remove_scopes:
    - admin:enterprise
    - admin:gpg_key
    - admin:org
    - admin:org_hook
    - admin:public_key
    - admin:ssh_signing_key
    - codespace
    - delete:packages
    - delete_repo
    - manage_billing:enterprise
    - manage_runners:enterprise
    - write:gpg_key
    - write:org
    - write:packages
    - write:public_key
    - write:ssh_signing_key
  forbidden_scopes:
    - admin:enterprise
    - manage_billing:enterprise
    - manage_runners:enterprise
  implied:
    repo:
      - repo:status
      - repo_deployment
      - public_repo
      - repo:invite
      - security_events
      - admin:repo_hook
      - write:repo_hook
      - read:repo_hook
    public_repo:
      - admin:repo_hook
      - write:repo_hook
      - read:repo_hook
    admin:repo_hook:
      - write:repo_hook
      - read:repo_hook
    write:repo_hook:
      - read:repo_hook
    admin:org:
      - write:org
      - read:org
    write:org:
      - read:org
    admin:public_key:
      - write:public_key
      - read:public_key
    write:public_key:
      - read:public_key
    admin:gpg_key:
      - write:gpg_key
      - read:gpg_key
    write:gpg_key:
      - read:gpg_key
    admin:ssh_signing_key:
      - write:ssh_signing_key
      - read:ssh_signing_key
    write:ssh_signing_key:
      - read:ssh_signing_key
    user:
      - read:user
      - user:email
      - user:follow
    project:
      - read:project
    write:packages:
      - read:packages
    write:discussion:
      - read:discussion
    admin:enterprise:
      - manage_runners:enterprise
      - manage_billing:enterprise
      - read:enterprise

workspace:
  scope_suffixes:
    - userinfo.email
    - userinfo.profile
    - calendar
    - chat.customemojis
    - chat.memberships
    - chat.memberships.app
    - chat.messages
    - chat.messages.reactions
    - chat.spaces
    - chat.spaces.create
    - chat.users.readstate
    - chat.users.spacesettings
    - cloudsupport
    - contacts
    - contacts.other.readonly
    - directory.readonly
    - documents
    - drive
    - drive.activity.readonly
    - forms.body
    - forms.responses.readonly
    - gmail.modify
    - gmail.settings.basic
    - meetings.conference.media.readonly
    - meetings.space.created
    - meetings.space.readonly
    - meetings.space.settings
    - presentations
    - pubsub
    - script.deployments
    - script.processes
    - script.projects
    - spreadsheets
    - tasks
  forbidden_scopes:
    - https://mail.google.com/
    - https://www.googleapis.com/auth/cloud-platform
    - https://www.googleapis.com/auth/gmail.settings.sharing
  api_names:
    - calendar-json
    - chat
    - cloudsupport
    - docs
    - drive
    - driveactivity
    - forms
    - gmail
    - keep
    - meet
    - people
    - pubsub
    - script
    - sheets
    - slides
    - tasks
    - workspaceevents

gcp:
  adc_scope_suffixes:
    - userinfo.email
    - cloud-platform
    - sqlservice.login
    - colaboratory
    - bigquery.readonly
    - logging.read
    - cloud-platform.read-only
  login_markers:
    - invalid scopes value
    - invalid_grant
    - expired or revoked
    - reauthenticat
    - to obtain new credentials
    - gcloud auth login
    - gcloud auth application-default login
    - not currently have an active account
    - no credentialed accounts
    - default credentials were not found
    - could not automatically determine credentials
    - credentials not found

doctor_tools:
  - age
  - agy
  - betterleaks
  - bf
  - chezmoi
  - claude
  - copilot
  - dprint
  - file
  - gcloud
  - gh
  - git
  - git-cliff
  - gws
  - jactionlint
  - lefthook
  - mise
  - nvim
  - opencode
  - pgcli
  - pi
  - python
  - ruff
  - sqlite3
  - sqruff
  - supagents
  - tree-sitter
  - trivy
  - ty
  - typst
