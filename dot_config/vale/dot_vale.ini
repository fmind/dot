# Docs: https://vale.sh/docs/vale-ini
StylesPath = styles
MinAlertLevel = warning
IgnoredScopes = code, tt
SkippedScopes = script, style, pre, figure

[*.{md,mdx,txt,html}]
BasedOnStyles = Fmind

[*.html]
Fmind.ProseBackticks = NO

# Repository docs legitimately use inline code, command lines, and dense reference lists.
[{README.md,**/README.md,CONTRIBUTING.md,**/CONTRIBUTING.md,CHANGELOG.md,**/CHANGELOG.md}]
Fmind.ProseBackticks = NO
Fmind.ParagraphLength = NO
Fmind.SentenceLength = NO

# Documentation directories need inline code for flags, configs, and symbols while keeping prose scannable.
[{docs/**,**/docs/**}]
Fmind.ProseBackticks = NO

# Internal agent instructions and GitHub repo templates legitimately use inline code and em dashes.
[{AGENTS.md,**/AGENTS.md,CLAUDE.md,**/CLAUDE.md,.agents/**,**/.agents/**,.claude/**,**/.claude/**,.github/**,**/.github/**}]
Fmind.EmDash = NO
Fmind.ProseBackticks = NO
Fmind.ParagraphLength = NO
Fmind.SentenceLength = NO
