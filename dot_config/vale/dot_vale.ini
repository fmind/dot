# Docs: https://vale.sh/docs/vale-ini
StylesPath = styles
MinAlertLevel = warning
IgnoredScopes = code, tt
SkippedScopes = script, style, pre, figure

[formats]
typ = txt

[*.{md,mdx,txt,html,htm}]
BasedOnStyles = Fmind

# ProseBackticks parses CommonMark; disable on HTML, MDX, plain text, and Typst.
[*.{mdx,txt,html,htm}]
Fmind.ProseBackticks = NO

# Typst decks map prose to plain text; skip length counters that treat #slide(...) blocks as one sentence.
[*.typ]
BasedOnStyles = Fmind
Fmind.ParagraphLength = NO
Fmind.ProseBackticks = NO
Fmind.SentenceLength = NO

# Repository and technical docs legitimately use inline code, command lines, PR references, and dense reference lists.
[{README.md,**/README.md,CONTRIBUTING.md,**/CONTRIBUTING.md,CHANGELOG.md,**/CHANGELOG.md,SECURITY.md,**/SECURITY.md,CODE_OF_CONDUCT.md,**/CODE_OF_CONDUCT.md,docs/**,**/docs/**}]
Fmind.InternalPlumbing = NO
Fmind.ParagraphLength = NO
Fmind.ProseBackticks = NO
Fmind.SentenceLength = NO

# Internal agent instructions and GitHub repo templates legitimately use inline code, repo references, and em dashes.
[{CLAUDE.md,**/CLAUDE.md,GEMINI.md,**/GEMINI.md,copilot-instructions.md,**/copilot-instructions.md,SKILL.md,**/SKILL.md,.agents/**,**/.agents/**,.claude/**,**/.claude/**,.gemini/**,**/.gemini/**,.github/**,**/.github/**}]
Fmind.EmDash = NO
Fmind.InternalPlumbing = NO
Fmind.ParagraphLength = NO
Fmind.ProseBackticks = NO
Fmind.SentenceLength = NO

# Enforce no em dashes in AGENTS.md files (including under .agents/) while allowing dense reference lists and code spans.
[{AGENTS.md,**/AGENTS.md}]
Fmind.EmDash = YES
Fmind.InternalPlumbing = NO
Fmind.ParagraphLength = NO
Fmind.ProseBackticks = NO
Fmind.SentenceLength = NO

# Skip vendored dependencies, build artifacts, and third-party license texts.
[{.venv/**,**/.venv/**,venv/**,**/venv/**,node_modules/**,**/node_modules/**,vendor/**,**/vendor/**,dist/**,**/dist/**,build/**,**/build/**,LICENSE,LICENSE.*,**/LICENSE,**/LICENSE.*}]
Fmind = NO
