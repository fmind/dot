# Docs: https://github.com/lsd-rs/lsd/blob/main/doc/colors.md
# Source: https://github.com/fmind/theme/blob/main/lsd/fmind.yaml
# Update this file after changing the upstream theme.
# Green means success/new/readable; red means an error or deletion.

user: yellow
group: dark_grey
permission:
  read: green
  write: yellow
  exec: green
  exec-sticky: magenta
  no-access: dark_grey
date:
  hour-old: cyan
  day-old: green
  older: dark_grey
size:
  none: dark_grey
  small: green
  medium: yellow
  large: red
inode:
  valid: magenta
  invalid: red
links:
  valid: cyan
  invalid: red
git-status:
  unmodified: dark_grey
  ignored: dark_grey
  new-in-index: green
  new-in-workdir: green
  deleted: red
  renamed: cyan
  modified: yellow
  conflicted: red
