# Docs: https://github.com/lsd-rs/lsd/blob/main/doc/colors.md
#
# fmind/theme spends ANSI slot 2 on `string`, which is a white, and slot 4 on
# `function`, which is the green. So every entry below that means *ok*, *new* or
# *readable* asks for `blue` rather than `green`: asking for green here gets a
# white listing, which is the one thing an ls should never be.

user: yellow
group: 243
permission:
  read: blue
  write: yellow
  exec: red
  exec-sticky: magenta
  no-access: 240
date:
  hour-old: cyan
  day-old: blue
  older: 243
size:
  none: 243
  small: blue
  medium: yellow
  large: red
inode:
  valid: magenta
  invalid: red
links:
  valid: cyan
  invalid: red
git-status:
  unmodified: 243
  ignored: 243
  new-in-index: blue
  new-in-workdir: blue
  deleted: red
  renamed: cyan
  modified: yellow
  conflicted: red
