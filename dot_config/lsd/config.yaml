# Docs: https://github.com/lsd-rs/lsd#customizing-lsd-configuration-and-theming

blocks:
  - permission
  - user
  - group
  - size
  - date
  - git
  - name
color:
  theme: custom
date: relative
icons:
  when: always
ignore-globs:
  - .DS_Store
  - .git
  - .ipynb_checkpoints
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - __pycache__
literal: true
sorting:
  dir-grouping: first
