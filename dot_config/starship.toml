"$schema" = "https://starship.rs/config-schema.json"
# Docs: https://starship.rs/config/

add_newline = false
format = "$directory$git_branch$git_state$git_status$kubernetes$cmd_duration$character"

palette = "fmind"

# Generated block, do not hand-edit. Starship has no include mechanism, so this
# is the one place a palette is copied rather than referenced.
# source: https://github.com/fmind/theme/blob/v2.1.0/starship/fmind.toml
# regenerate: uv run render.py in fmind/theme, then copy the [palettes.*] block
[palettes.fmind]
text = "#56ff40"
green = "#d6d8d6"
bright_green = "#26fed9"
red = "#f63a4b"
orange = "#ff7800"
blue = "#35ab24"
cyan = "#2ad7f5"
gray = "#7e8a7b"

[directory]
style = "bold blue"

[git_branch]
style = "bold red"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold orange"
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 1500
style = "bold gray"
format = "took [$duration]($style) "

[character]
error_symbol = "[❯](bold red)"
success_symbol = "[❯](bold blue)"
vimcmd_replace_one_symbol = "[❮](bold bright_green)"
vimcmd_replace_symbol = "[❮](bold bright_green)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_visual_symbol = "[❮](bold orange)"

[kubernetes]
disabled = false
format = 'on [☸  $context (\($namespace\))](bold blue) '

[[kubernetes.contexts]]
context_pattern = "gke_.*_prod-.*"
context_alias = "prod-gke"
