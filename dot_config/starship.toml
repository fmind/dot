"$schema" = "https://starship.rs/config-schema.json"
# Docs: https://starship.rs/config/

add_newline = false
format = "$directory$git_branch$git_state$git_status$cmd_duration$character"

palette = "fmind"

# Source: https://github.com/fmind/theme/blob/main/themes/starship/fmind.toml
[palettes.fmind]
text = "#202124"
green = "#0d652d"
bright_green = "#0d652d"
red = "#a50e0e"
orange = "#934900"
blue = "#174ea6"
cyan = "#00636d"
gray = "#595d62"
purple = "#681da8"
magenta = "#681da8"
yellow = "#934900"
white = "#202124"
black = "#202124"

[directory]
style = "bold blue"

[git_branch]
# Branch identity is green; red is reserved for a failed command.
style = "bold green"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold orange"

[cmd_duration]
min_time = 1500
style = "bold gray"

[character]
vimcmd_replace_one_symbol = "[❮](bold bright_green)"
vimcmd_replace_symbol = "[❮](bold bright_green)"
vimcmd_visual_symbol = "[❮](bold orange)"
