# :schema https://mise.jdx.dev/schema/mise.json
# Docs: https://mise.jdx.dev/configuration.html

[task_config]
# Preserve the caller directory and selected native provider profile.
dir = "{{cwd}}"

[tasks."dot:cache"]
description = "Inspect uv, Hugging Face, and selected Docker disk usage without pruning"
depends = ["dot:cache:docker", "dot:cache:hf", "dot:cache:uv"]

[tasks."dot:cache:docker"]
description = "Inspect disk usage on the selected Docker daemon"
run = "docker system df"

[tasks."dot:cache:hf"]
description = "List cached Hugging Face models and datasets"
run = "hf cache ls"

[tasks."dot:cache:uv"]
description = "Show uv cache size"
run = "uv cache size --preview-features cache-size"
