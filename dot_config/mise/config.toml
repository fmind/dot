# :schema https://mise.jdx.dev/schema/mise.json
# Docs: https://mise.jdx.dev/configuration.html

[settings]
# Upstream cosign/minisign/SLSA/GitHub attestation coverage is patchy; npm provenance and packslip
# signatures stay on, and dot_tasks.mise_refresh enforces download digests in revision-4 lockfiles.
aqua.cosign = false
aqua.minisign = false
# asdf plugins lock without checksums and may compile from source.
disable_backends = ["asdf"]
env_cache = true
# `gh` stores tokens in the system keyring, so mise's hosts.yml fallback hits GitHub unauthenticated (60 req/h).
github.credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'
github_attestations = false
# Never let ad-hoc global installs drop macOS entries or specifiers captured by `mise run lock`.
locked = true
locked_scopes = ["global"]
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]
# Explicit "0d" overrides mise's 24h default cooldown while satisfying self_update.minimum_release_age (rejects bare "0").
minimum_release_age = "0d"
# Never enable python.uv_venv_auto globally (activates untrusted .venv/bin); opt in per project.
self_update.auto = "24h"
slsa = false

[tool_alias]
fish = "aqua:fish-shell/fish-shell"
# The registry default (vfox) locks release URLs without digests; aqua locks checksums.
neovim = "aqua:neovim/neovim"

[env]
# agents-cli 1.9.0 turned usage telemetry on by default; keep pypi:google-agents-cli out of global
# [tools] while 1.13.0 caps pyopenssl<26.2 (cryptography<48, 4 HIGH CVEs).
AGENTS_CLI_TELEMETRY = "0"
ASTRO_TELEMETRY_DISABLED = "1"
# The AWS CLI otherwise prompts detected agents to install its Agent Toolkit skills;
# vendor skills go through the vendor-skill policy instead.
AWS_CLI_AGENT_TOOLKIT_HINT_DISABLED = "true"
CF_SEND_TELEMETRY = "0"
# Also covers ad-hoc chrome-devtools-mcp runs that omit --no-usage-statistics.
CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS = "1"
# "1" auto-approves tools only; "true" would also trust every directory and bypass `dot trust`.
COPILOT_ALLOW_ALL = "1"
# Copilot's autoUpdate setting only stops downloads; this also makes launches ignore newer
# cached builds, so the mise-locked version is the one that runs.
COPILOT_AUTO_UPDATE = "false"
# Copilot-owned GitHub and Entra authentication telemetry; no settings key covers it.
COPILOT_TELEMETRY_DISABLED = "true"
HF_HUB_DISABLE_TELEMETRY = "1"
# Skip hf's PyPI/extension update checks, /api/agent-harnesses fetch, and hf-cli skill hint.
HF_HUB_DISABLE_UPDATE_CHECK = "1"
# ~/.claude/skills links to ~/.agents/skills, which OpenCode already reads natively.
OPENCODE_DISABLE_CLAUDE_CODE_SKILLS = "1"
# mise locks Pi: skip its pi.dev latest-version request and its install/update ping
# (PI_TELEMETRY also drops Pi's attribution headers on provider requests).
PI_SKIP_VERSION_CHECK = "1"
PI_TELEMETRY = "0"
RIPGREP_CONFIG_PATH = "{{env.HOME}}/.config/ripgrep/config"
# Keep sonarqube-cli off the macOS Keychain (whose partition ACL blocks background probes and prompts repeatedly).
# Its file store writes with default permissions, so chezmoi seeds a private tokens.json it then keeps.
SONARQUBE_CLI_KEYCHAIN_FILE = "{{env.HOME}}/.sonar/sonarqube-cli/tokens.json"
TRIVY_CONFIG = "{{env.HOME}}/.config/trivy/trivy.yaml"
# Never set DO_NOT_TRACK or DISABLE_TELEMETRY globally: Claude Code reads either as
# "feature flags off", which disables Remote Control; scope them to single commands.

# Selection rule: "Global tools and generated locks" in fmind/dot's AGENTS.md; a project tool kept global says why in its comment.
[tools]
"conda:file" = "latest"
# macOS ships both natively (mandoc renders man pages there).
"conda:groff" = { version = "latest", os = ["linux"] }
"conda:unzip" = { version = "latest", os = ["linux"] }
"github:DataDog/pup" = "latest"
# github, not aqua: aqua names the binary docker-cli-plugin-docker-buildx, which Docker does not
# discover; Docker plugins must be named docker-<name>. See colima below.
"github:docker/buildx" = { version = "latest", os = ["macos"], bin = "docker-buildx" }
# fastfetch 2.70.0 replaced macos-aarch64 with macos-universal, breaking aqua's src path.
"github:fastfetch-cli/fastfetch" = "latest"
# OpenCode 2.x ships through npm (the mise registry moved here from aqua). mise skips its postinstall, which links
# the locked platform binary that fits this CPU into bin/; run it offline so it never fetches an unlocked package.
"npm:@opencode/cli" = { version = "latest", postinstall = 'cd "$MISE_TOOL_INSTALL_PATH/node_modules/@opencode/cli" && npm_config_offline=true node postinstall.mjs' }
# Beta-only upstream (npm latest is 1.0.0-beta.N): a deliberate exception to latest-stable until 1.0.0.
"npm:cf" = "latest"
# npm, not aqua: upstream's standalone macOS binary is x86_64-only, so it would need Rosetta on Apple Silicon.
# encodeurl@1.0.3 (pillarjs/encodeurl@c669d95) and encodeurl@2.0.2 (pillarjs/encodeurl@f805c3e) were manually backported by blakeembrey after 3.0.0 enabled OIDC provenance.
"npm:firebase-tools" = { version = "latest", trust_policy_excludes = [
  "encodeurl@1.0.3",
  "encodeurl@2.0.2",
] }
"npm:skills" = "latest"
# Bind pypi tools to the global Python minor so project python pins neither re-hash them nor hit missing 3.15 wheels.
"pypi:brain-framework" = { version = "latest", python = "3.14" }
"pypi:copier" = { version = "latest", python = "3.14" }
"pypi:fmind" = { version = "latest", python = "3.14" }
# Let google-colab-cli select its compatible jupyter-kernel-client version;
# an additional `with` pin can conflict with its exact upstream requirement.
"pypi:google-colab-cli" = { version = "latest", python = "3.14" }
"pypi:huggingface_hub" = { version = "latest", python = "3.14" }
# Keep `with`: kaggle 2.2.5 imports six without declaring it, and python-dateutil 4 no longer brings it.
"pypi:kaggle" = { version = "latest", python = "3.14", with = ["six"] } # Kaggle dataset and competition CLI
"pypi:marimo" = { version = "latest", python = "3.14" }
# Keep `with`: pgcli needs psycopg's binary extra for a bundled libpq.
"pypi:pgcli" = { version = "latest", python = "3.14", with = ["psycopg[binary]"] }
"pypi:vulture" = { version = "latest", python = "3.14" } # Python dead-code scanner for full-review sweeps outside projects; projects pin their own
acli = "latest"
age = "latest"
ast-grep = "latest"
astro = "latest" # Airflow DAG dev/parse outside projects; projects pin their own
atuin = "latest"
awscli = "latest"
bat = "latest"
betterleaks = "latest"
bitwarden = "latest"
chezmoi = "latest"
claude = "latest"
# macOS container runtime (Linux uses native Docker Engine); ~/.docker/config.json resolves Compose/Buildx via shims.
colima = { version = "latest", os = ["macos"] }
copilot = "latest"
cosign = "latest" # Keyless Sigstore OCI signing/verification outside projects; projects pin their own
databricks-cli = "latest"
delta = "latest"
docker-cli = { version = "latest", os = ["macos"] }
docker-compose = { version = "latest", os = ["macos"] }
doggo = "latest"
dprint = "latest"
duckdb = "latest"
fd = "latest"
ffmpeg = "latest" # Media conversion and ffprobe outside projects
fish = "latest"
fzf = "latest"
gcloud = "latest"
gh = "latest"
git-cliff = "latest"
git-lfs = "latest"
hyperfine = "latest"
imagemagick = "latest" # snacks.nvim non-PNG image previews in Neovim
jactionlint = "latest"
jq = "latest"
lazydocker = "latest"
lazygit = "latest"
lefthook = "latest"
lima = { version = "latest", os = ["macos"] }
lsd = "latest"
lychee = "latest"
neovim = "latest"
node = "lts" # Runtime for third-party npm CLIs only; active project authoring is Python
opentofu = "latest" # Neovim Terraform formatting/validation outside projects; projects pin their own
pi = "latest"
python = "3.14" # Required tool wheels are not ready for 3.15
ripgrep = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
sonarqube-cli = "latest"
sqlite = "latest"
starship = "latest"
stylua = "latest" # Lua formatter LazyVim uses outside this repository
tflint = "latest" # Terraform linter LazyVim uses outside projects; projects pin their own
tree-sitter = "latest" # Parser CLI backing nvim-treesitter (Linux binary requires glibc 2.39+)
trivy = "latest"
ty = "latest"
typos = "latest"
typst = "latest" # Composed diagrams and standalone PDFs outside projects; projects pin their own
usage = "latest" # Powers mise CLI completions
uv = "latest"
vault = "latest"
xh = "latest"
yazi = "latest"
yq = "latest"
zellij = "latest"
zoxide = "latest"

[tools."github:a2aproject/a2a-cli"]
version = "latest" # Official CLI client for Agent2Agent (A2A) agents

[tools."github:a2aproject/a2a-cli".platforms]
linux-arm64 = { asset_pattern = "*linux_arm64*" }
linux-x64 = { asset_pattern = "*linux_amd64*" }
macos-arm64 = { asset_pattern = "*darwin_arm64*" }

[tools."github:googleworkspace/cli"]
# Upstream ships glibc and musl assets side by side; select musl explicitly for portability.
version = "latest" # Google Workspace CLI (gws)

[tools."github:googleworkspace/cli".platforms]
linux-arm64 = { asset_pattern = "*aarch64-unknown-linux-musl*" }
linux-x64 = { asset_pattern = "*x86_64-unknown-linux-musl*" }
macos-arm64 = { asset_pattern = "*aarch64-apple-darwin*" }
