# :schema https://mise.jdx.dev/schema/mise.json
# Docs: https://mise.jdx.dev/configuration.html

[settings]
# Signature/provenance verification (cosign, minisign, SLSA, GitHub attestations)
# is deliberately off across every backend: upstream attestation coverage is too
# patchy to gate routine upgrades on, and this is a single-user workstation. The
# lockfile records a digest for every download and conda dependency, and
# dot/dot_tasks/mise_refresh.py refuses a lock that misses one.
# Newly published releases are eligible immediately. Lock revision 3 records supported
# npm and pipx dependency graphs in locks/; keep these native files with mise.lock
# and install with --locked. First fetches are unverified.
aqua.cosign = false
aqua.minisign = false
# Interactive prompts draw from the terminal's sixteen slots rather than from
# mise's own palette, so they follow fmind/theme like everything else.
color_theme = "base16"
# asdf plugins lock without checksums and may compile from source; registry tools
# must resolve to aqua, conda, github, or vfox instead.
disable_backends = ["asdf"]
env_cache = true
# `gh` stores its token in the system keyring, so mise's default gh_cli_tokens
# fallback (which parses ~/.config/gh/hosts.yml) finds nothing and hits the GitHub
# API unauthenticated: 60 req/h, which `mise upgrade` blows through in 429 storms.
# Shelling out to `gh auth token` keeps the token out of the dotfiles and out of the
# process environment, at the cost of one `gh` invocation per token lookup.
github.credential_command = "gh auth token"
github_attestations = false
# Global installs (including exec and shim auto-installs) never rewrite this lock: an unlocked
# install drops the macOS entries and specifiers that `mise run lock` captured. Only `mise lock`
# writes it; projects keep their own lock policy.
locked = true
locked_scopes = ["global"]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]
# Resolve fuzzy versions such as `latest` without a release-age delay.
minimum_release_age = "0d"
# Never set python.uv_venv_auto globally: it puts any cloned repository's .venv/bin first
# on PATH without `mise trust`. Opt in per project with `[settings]` in a trusted mise.toml.
# Update the workstation mise binary before interactive commands on the same 24h cadence
# as mise's end-of-command version check, so `mise run full` never finishes with a stale-binary warning.
self_update.auto = true
self_update.check_duration = "24h"
slsa = false
# Trust is machine-local: use `mise trust` for individual configs or keep
# trusted_config_paths in unmanaged ~/.config/mise/conf.d/trust.toml.

[tool_alias]
fish = "aqua:fish-shell/fish-shell"
# The registry default (vfox) locks release URLs without digests; aqua locks checksums.
neovim = "aqua:neovim/neovim"

[env]
# agents-cli 1.9.0 turned usage telemetry on by default.
AGENTS_CLI_TELEMETRY = "0"
# The AWS CLI otherwise prompts detected agents to install its Agent Toolkit skills;
# vendor skills go through the vendor-skill policy instead.
AWS_CLI_AGENT_TOOLKIT_HINT_DISABLED = "true"
ASTRO_TELEMETRY_DISABLED = "1"
CF_SEND_TELEMETRY = "0"
# Also covers ad-hoc chrome-devtools-mcp runs that omit --no-usage-statistics.
CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS = "1"
# Copilot's autoUpdate setting only stops downloads; this also makes launches ignore newer
# cached builds, so the mise-locked version is the one that runs.
COPILOT_AUTO_UPDATE = "false"
HF_HUB_DISABLE_TELEMETRY = "1"
# Never set DO_NOT_TRACK or DISABLE_TELEMETRY globally: Claude Code reads either as
# "feature flags off", which disables Remote Control; scope them to single commands.

[tools]
"aqua:github/copilot-cli" = "latest" # GitHub Copilot terminal-based AI coding agent CLI
"conda:file" = "latest" # File type detection for agents and Yazi; includes its magic database
# macOS ships both natively (mandoc renders man pages there).
"conda:groff" = { version = "latest", os = ["linux"] } # Man-page renderer that `aws <command> help` requires
"conda:unzip" = { version = "latest", os = ["linux"] } # ZIP extraction for Mason packages and installers
"github:DataDog/pup" = "latest" # Official Datadog command-line interface (pup) for logs, monitors, and OAuth PKCE
"github:databricks/cli" = "latest" # Databricks command-line interface for Asset Bundles, Lakeflow, and Unity Catalog
# DuckDB 2.0 renamed its CLI assets (duckdb-cli-<os>-<arch>.tar.gz); aquaproj/aqua-registry#62901 (2026-10-24) fixes
# the registry. Return to `duckdb = "latest"` once a mise release after 2026.10.18 bundles that registry.
"github:duckdb/duckdb" = { version = "latest", matching = "duckdb-cli-" } # Embedded SQL analytical database management system
# fastfetch 2.70.0 replaced macos-aarch64 with macos-universal, breaking aqua's src path.
"github:fastfetch-cli/fastfetch" = "latest" # Active, customizable system info fetching tool
# Beta-only upstream (npm latest is 1.0.0-beta.N): a deliberate exception to latest-stable until 1.0.0.
"npm:cf" = "latest" # Official Cloudflare agentic CLI (cf)
"npm:skills" = "latest" # Agent Skills CLI manager
"pipx:aws-sso-util" = "latest" # Utilities for AWS SSO/IAM Identity Center authentication
"pipx:brain-framework" = "latest" # Brain Framework CLI (bf)
"pipx:copier" = "latest" # Default project template generator and updater
"pipx:fmind" = "latest" # Fmind portfolio reader; renders www.fmind.dev from the terminal
# Let google-colab-cli select its compatible jupyter-kernel-client version;
# an additional `with` pin can conflict with its exact upstream requirement.
"pipx:google-colab-cli" = "latest" # CLI client for Google Colab
"pipx:huggingface_hub" = "latest" # Hugging Face Hub CLI client
"pipx:kaggle" = "latest" # Kaggle dataset and competition CLI
# Keep `with`: pgcli needs psycopg's binary extra for a bundled libpq.
"pipx:pgcli" = { version = "latest", with = ["psycopg[binary]"] } # PostgreSQL client; bundled libpq
acli = "latest" # Atlassian CLI for Jira and Confluence from the terminal
actionlint = "latest" # Correctness linter for GitHub Actions workflows
age = "latest" # Simple and secure file encryption tool
ast-grep = "latest" # Code structural search, lint, and rewrite tool
astro = "latest" # Astronomer CLI for local Apache Airflow development and DAG testing
atuin = "latest" # Magical shell history replacement database
awscli = "latest" # Official Amazon Web Services command-line interface
bat = "latest" # Cat clone with syntax highlighting and git integration
bitwarden = "latest" # Official Bitwarden CLI (bw) for password management
chezmoi = "latest" # Dotfiles manager across diverse machines
claude = "latest" # Claude Code terminal-based AI coding agent CLI
delta = "latest" # Syntax-highlighter for git, diff, and grep output
doggo = "latest" # Command-line DNS client supporting modern protocols
dprint = "latest" # Pluggable and ultra-fast code formatter
fd = "latest" # Simple, fast replacement for the find command
ffmpeg = "latest" # Audio and video converter and probe (ffprobe) for media work outside projects
fish = "latest" # Friendly interactive shell (Fish)
fzf = "latest" # Interactive general-purpose fuzzy finder
gcloud = "latest" # Google Cloud SDK command-line utility
gh = "latest" # GitHub official command-line tool
git-cliff = "latest" # Generate changelogs from Conventional Commits
git-lfs = "latest" # Git Large File Storage helper
gitleaks = "latest" # Audits git repositories for secrets and keys
hyperfine = "latest" # Command-line benchmarking utility
imagemagick = "latest" # Image converter snacks.nvim needs to preview non-PNG images in Neovim
jq = "latest" # Command-line JSON processor
lazydocker = "latest" # Terminal UI for managing Docker containers
lazygit = "latest" # Terminal UI for Git commands
lefthook = "latest" # Fast and powerful Git hooks runner
lsd = "latest" # Modern, feature-rich replacement for ls
lychee = "latest" # Fast link checker for Markdown, HTML, and websites
neovim = "latest" # Extensible Vim-based text editor
node = "lts" # Runtime for third-party npm CLIs only; active project authoring is Python.
opencode = "latest" # OpenCode AI agent CLI tool
python = "3.14" # Python interpreter; required tool wheels are not ready for 3.15
ripgrep = "latest" # Blazing-fast grep alternative
ruff = "latest" # High-performance Python linter and formatter
shellcheck = "latest" # Static analysis tool for shell scripts
shfmt = "latest" # Parser, formatter, and interpreter for shell code
sonarqube-cli = "latest" # SonarQube & SonarCloud CLI for code quality, security, and AI agents
sqlite = "latest" # Lightweight SQL database engine CLI
starship = "latest" # Minimal and customizable cross-shell prompt
tree-sitter = "latest" # Parser generator CLI backing nvim-treesitter; Linux binary requires glibc 2.39+
trivy = "latest" # Security vulnerability and secret scanner
ty = "latest" # Astral's high-performance Python type checker
typos = "latest" # Source code and documentation spell checker with low false positives
usage = "latest" # Specification and completion tool for CLIs (powers mise completions)
uv = "latest" # Astral's high-performance Python package installer
vault = "latest" # HashiCorp Vault command-line interface for secrets management
xh = "latest" # Fast, friendly tool for sending HTTP requests
yazi = "latest" # Blazing-fast terminal file manager in Rust
yq = "latest" # Command-line YAML, XML, and TOML processor
zellij = "latest" # Terminal multiplexer and workspace built in Rust
zizmor = "latest" # Security auditor for GitHub Actions workflows
zoxide = "latest" # Smarter cd command that learns directories

[tools."github:a2aproject/a2a-cli"]
version = "latest" # Official CLI client for Agent2Agent (A2A) agents

[tools."github:a2aproject/a2a-cli".platforms]
linux-x64 = { asset_pattern = "*linux_amd64*" }
macos-arm64 = { asset_pattern = "*darwin_arm64*" }

[tools."github:googleworkspace/cli"]
# Upstream ships glibc and musl assets side by side; select musl explicitly for portability.
version = "latest" # Google Workspace CLI (gws)

[tools."github:googleworkspace/cli".platforms]
linux-x64 = { asset_pattern = "*x86_64-unknown-linux-musl*" }
macos-arm64 = { asset_pattern = "*aarch64-apple-darwin*" }
