# Docs: https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html#ExecStart=
# agy writes this unit itself and runs agent commands in bash, so remote-control sessions would
# miss what fish exports to terminal sessions (env.fish, mise shims, `dot` instead of Graphviz).
# Starting through non-interactive fish gives both the same environment. The runtime path, not
# the fish shim (which prepends every global tool), keeps the shims first so project pins apply.
[Service]
# The interactive agy function (fish/functions/agy.fish) sets both too, and Claude settings set
# CLOUDSDK_CORE_DISABLE_PROMPTS; agy has no environment setting of its own.
Environment=CLOUDSDK_CORE_DISABLE_PROMPTS=1
Environment=GH_PROMPT_DISABLED=1
ExecStart=
ExecStart=%h/.local/share/mise/installs/fish/latest/fish -c 'exec %h/.local/bin/agy remote-control serve'
