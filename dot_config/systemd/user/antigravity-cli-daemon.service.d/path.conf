# Docs: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#Environment=
# agy writes this unit itself; systemd starts it with a bare PATH, so remote-control
# sessions would miss mise tools and resolve `dot` to Graphviz. Shims honor project pins.
[Service]
Environment=PATH=%h/.local/share/mise/shims:%h/.local/bin:/usr/local/bin:/usr/bin:/bin
