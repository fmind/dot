# Docs: https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html#ExecStart=
# agy writes this unit itself and runs agent commands in bash. Starting through non-interactive
# fish and the agy function (fish/functions/agy.fish) gives remote-control sessions the terminal
# environment (env.fish, mise shims first on PATH, no gh or gcloud prompts) while exec keeps
# MainPID on the agy binary. Use the runtime path, not the fish shim, so mise does not prepend
# every global tool install path.
[Service]
ExecStart=
ExecStart=%h/.local/share/mise/installs/fish/latest/fish -c 'agy remote-control serve'
