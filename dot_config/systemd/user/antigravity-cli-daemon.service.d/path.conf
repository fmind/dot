# Docs: https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html#ExecStart=
# Launch via non-interactive fish (fish/functions/agy.fish) so remote sessions get env.fish, mise shims
# first, and prompt suppression while `exec` keeps MainPID on agy (skip fish shim to avoid global tool paths).
[Service]
ExecStart=
ExecStart=%h/.local/share/mise/installs/fish/latest/fish -c 'agy remote-control serve'
