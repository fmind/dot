# Docs: https://trivy.dev/docs/latest/references/configuration/config-file/

timeout: 15m
exit-code: 1
severity:
  - HIGH
  - CRITICAL
pkg:
  # Development tools execute locally and in CI, so include their dependencies.
  include-dev-deps: true
scan:
  # Keep scans local: no usage data or version notices to Aqua (top-level keys are ignored).
  disable-telemetry: true
  skip-version-check: true
  # Betterleaks owns secret scanning; keep one secret scanner per repository.
  scanners:
    - license
    - misconfig
    - vuln
  # mise's npm tool locks use aube's pnpm-compatible format under its own name.
  file-patterns:
    - pnpm:aube-lock\.yaml
  skip-dirs:
    - "**/.cache"
    - "**/.pytest_cache"
    - "**/.ruff_cache"
    - "**/.ty_cache"
    - "**/.venv"
    - "**/__pycache__"
    - .agents/prompts
    - .agents/tmp
    - .claude
    - .gemini
    - .git
vulnerability:
  ignore-unfixed: true
