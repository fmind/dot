# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
# Docs: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

disableStartupPopups: true
git:
  diffContextSize: 7
  diffRenderers:
    - name: delta
      command: delta --paging=never --features={{if gt .width 120}}side-by-side{{end}}
      colorArg: always
    - name: delta unified
      command: delta --paging=never --features=
      colorArg: always
gui:
  sidePanelWidth: 0.3
  expandFocusedSidePanel: true
  commitAuthorLongLength: 22
  commitHashLength: 7
  # Filter lists fuzzily and show ahead/behind counts against the base branch.
  filterMode: fuzzy
  showDivergenceFromBaseBranch: arrowAndNumber
  scrollHeight: 5
  scrollPastBottom: false
  showCommandLog: false
  nerdFontsVersion: "3"
  # The fmind theme lives in theme.yml, merged through LG_CONFIG_FILE (env.fish).

os:
  editPreset: nvim
