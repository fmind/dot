# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
# Docs: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

disableStartupPopups: true
git:
  diffContextSize: 7
  diffRenderers:
    - command: delta --paging=never
      colorArg: always
gui:
  expandFocusedSidePanel: true
  scrollHeight: 5
  scrollPastBottom: false
  showCommandLog: false
  nerdFontsVersion: "3"
  # Source: https://github.com/fmind/theme/blob/main/lazygit/fmind.yml
  # Update this block after changing the upstream theme.
  theme:
    activeBorderColor: [blue, bold]
    inactiveBorderColor: ["#9aa0a6"]
    searchingActiveBorderColor: [yellow, bold]
    optionsTextColor: [blue]
    selectedLineBgColor: ["#d2e3fc"]
    cherryPickedCommitFgColor: ["#0d652d"]
    cherryPickedCommitBgColor: ["#ceead6"]
    markedBaseCommitFgColor: ["#174ea6"]
    markedBaseCommitBgColor: ["#feefc3"]
    unstagedChangesColor: [red]

os:
  editPreset: nvim
customCommands:
  - key: "G"
    context: "files"
    description: "Generate Conventional Commit message with Antigravity (agy)"
    loadingText: "Asking Antigravity..."
    output: terminal
    command: "git g"
