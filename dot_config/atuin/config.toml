# Docs: https://docs.atuin.sh/latest/configuration/config/

# Search behavior
enter_accept = true
inline_height = 0

# Vim keybindings
keymap_mode = "vim-insert"

# Privacy: no sync
auto_sync = false
update_check = false

# Search the current directory first
filter_mode = "directory"

# Up-arrow scoped to the session
filter_mode_shell_up_key_binding = "session"

[theme]
name = "fmind"
