# Docs: https://docs.atuin.sh/latest/configuration/config/

inline_height = 0
keymap_mode = "vim-insert"
auto_sync = false
update_check = false
# Match Fish's vi cursor shapes and Ghostty's steady cursor
keymap_cursor = { emacs = "steady-bar", vim_insert = "steady-bar", vim_normal = "steady-block" }

[search]
# Default to current-directory search; omit session-preload (Fish assigns a UUIDv4 session ID in plugins.fish).
filters = ["directory", "workspace", "session", "host", "global"]

[theme]
name = "fmind"
