# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json
# Docs: https://lefthook.dev/configuration/

glob_matcher: doublestar
# Jobs run sequentially in list order: formatters, Python fixes before style, then checks.
pre-commit:
  jobs:
    # Formatters receive only staged files and restage them. Generated skill indexes
    # are not refreshed here: check:skills fails on a stale one so it cannot be
    # committed unstaged and then break CI's clean-tree verification.
    - name: format:dprint
      glob: "**/*.{json,jsonc,md,toml,yaml,yml}"
      run: mise run format:dprint {staged_files}
      stage_fixed: true
    - name: format:lua:files
      glob: "**/*.lua"
      run: mise run format:lua:files {staged_files}
      stage_fixed: true
    # ruff.toml's extend-exclude (applied via --force-exclude) owns the template exclusions.
    - name: format:python:fix
      glob: "**/*.py"
      run: mise run format:python:fix {staged_files}
      stage_fixed: true
    - name: format:python:style
      glob: "**/*.py"
      run: mise run format:python:style {staged_files}
      stage_fixed: true
    - name: format:shell
      # The task formats exactly these plain scripts; shell templates are lint-only.
      glob: "{install.sh,run_*.sh,dot_local/bin/executable_*}"
      run: mise run format:shell
      stage_fixed: true
    - name: check:local
      run: mise run check:local
pre-push:
  jobs:
    # Vulnerability databases need the network; CI runs the same tasks through `check`.
    - name: check:network
      run: mise run check:network
    - name: test
      run: mise run test
