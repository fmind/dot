# Docs: https://trivy.dev/docs/latest/references/configuration/config-file/

timeout: 15m
exit-code: 1
severity:
  - HIGH
  - CRITICAL
pkg:
  # The repository executes its development toolchain during validation.
  include-dev-deps: true
scan:
  scanners:
    - license
    - misconfig
    - secret
    - vuln
  skip-dirs:
    - "**/.cache"
    - "**/.mypy_cache"
    - "**/.pytest_cache"
    - "**/.ruff_cache"
    - "**/.ty_cache"
    - "**/.venv"
    - "**/__pycache__"
    - .agents
    - .antigravitycli
    - .claude
    - .codex
    - .gemini
    - .git
    - .grok
    - dot_local/bin
vulnerability:
  ignore-unfixed: true
