timeout: 15m
exit-code: 1
severity:
  - HIGH
  - CRITICAL
pkg:
  # The repository executes its development toolchain during validation.
  include-dev-deps: true
scan:
  scanners:
    - license
    - misconfig
    - secret
    - vuln
  skip-dirs:
    - .agents
    - .antigravitycli
    - .claude
    - .gemini
    - .git
    - .ruff_cache
    - .venv
    - dot_local
vulnerability:
  ignore-unfixed: true
