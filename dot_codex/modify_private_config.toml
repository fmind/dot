# chezmoi:modify-template
{{- /* Hooks name the CLI absolutely: a harness started without ~/.local/bin on PATH
       cannot resolve dot, or resolves Graphviz's /usr/bin/dot instead, and notifications
       fail silently. */ -}}
{{- $dot := joinPath .chezmoi.homeDir ".local/bin/dot" -}}
{{- if not (regexMatch "^[A-Za-z0-9_@%+=:,./-]+$" $dot) }}{{ fail "home directory is not shell-safe for hook commands" }}{{ end -}}
{{- $managedConfig := fromToml (replace "@dot@" $dot `
# Docs: https://learn.chatgpt.com/docs/config-file/config-reference
approval_policy = "never"
background_terminal_max_timeout = 1200000
sandbox_mode = "danger-full-access"
suppress_unstable_features_warning = true
web_search = "live"

[agents]
job_max_runtime_seconds = 10800

[features]
memories = true
multi_agent_v2 = true
prevent_idle_sleep = true

# Retired session-capture events stay managed as empty: the merge never deletes deployed keys.
[hooks]
PreCompact = []
SessionEnd = []
SubagentStop = []

[[hooks.Stop]]
matcher = ""

[[hooks.Stop.hooks]]
command = "@dot@ agent hook notify codex stop"
statusMessage = "Notifying turn end"
timeout = 30
type = "command"

[memories]
generate_memories = true

[otel]
metrics_exporter = "none"
trace_exporter = "none"

[tui]
vim_mode_default = true

`) -}}
{{- $_ := set $managedConfig "log_dir" (joinPath .chezmoi.homeDir ".codex/log") -}}
{{- $_ = set $managedConfig "sqlite_home" (joinPath .chezmoi.homeDir ".codex/sqlite") -}}
{{- /* personality is a default rather than a managed key: it seeds a fresh config, then
       stays whatever /personality last set it to. */ -}}
{{- includeTemplate "toml-merge.tmpl" (dict
      "stdin" .chezmoi.stdin
      "managed" $managedConfig
      "defaults" (dict "personality" "pragmatic")) -}}
