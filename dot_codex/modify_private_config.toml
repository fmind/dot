# chezmoi:modify-template
{{- $managedConfig := fromToml `
# Docs: https://learn.chatgpt.com/docs/config-file/config-reference
approval_policy = "never"
background_terminal_max_timeout = 1200000
# mise owns the Codex version.
check_for_update_on_startup = false
sandbox_mode = "danger-full-access"
suppress_unstable_features_warning = true
web_search = "live"

[analytics]
enabled = false

[features]
memories = true
multi_agent_v2 = true
prevent_idle_sleep = true

[feedback]
enabled = false

[otel]
metrics_exporter = "none"

# Codex runs commands in a pseudo-terminal, so git credential and gcloud prompts would wait
# on input no agent answers; fail or take the default instead (Claude sets the same pair).
[shell_environment_policy.set]
CLOUDSDK_CORE_DISABLE_PROMPTS = "1"
GIT_TERMINAL_PROMPT = "0"

# The TUI owns attention alerts: Stop hooks can run before automatic continuation.
[tui]
notifications = true
vim_mode_default = true

` -}}
{{- $_ := set $managedConfig "log_dir" (joinPath .chezmoi.homeDir ".codex/log") -}}
{{- $_ = set $managedConfig "sqlite_home" (joinPath .chezmoi.homeDir ".codex/sqlite") -}}
{{- /* The brain's session-context hook prints plain text, which Codex adds as developer
       context on startup and resume. It joins host SessionStart hooks only where the brain is
       checked out, decoded from TOML so it compares with the target; Codex skips it until /hooks trusts it. */ -}}
{{- $sessionContext := joinPath .chezmoi.homeDir "fmind/brain/settings/hooks/session-context.py" -}}
{{- if stat $sessionContext -}}
{{-   $current := dict -}}
{{-   if ne (trim .chezmoi.stdin) "" }}{{ $current = fromToml .chezmoi.stdin }}{{ end -}}
{{-   $sessionStart := dig "hooks" "SessionStart" (list) $current -}}
{{-   if not (kindIs "slice" $sessionStart) }}{{ fail "hooks.SessionStart must be an array" }}{{ end -}}
{{-   $command := printf "%s %s" $sessionContext (joinPath .chezmoi.homeDir "fmind/brain") -}}
{{-   $entry := fromToml (printf "matcher = \"startup|resume\"\n[[hooks]]\ntype = \"command\"\ncommand = %s\ntimeout = 30\n" (toJson $command)) -}}
{{-   $present := false -}}
{{-   range $sessionStart }}{{ if deepEqual . $entry }}{{ $present = true }}{{ end }}{{ end -}}
{{- /* Touch hooks only when the entry is missing: append yields []interface{} while fromToml
       decodes tables as []map[string]interface{}, so a merged copy never deepEquals the target
       and toml-merge would re-serialize the file Codex keeps rewriting on every apply. */ -}}
{{-   if not $present }}{{ $_ = set $managedConfig "hooks" (dict "SessionStart" (append $sessionStart $entry)) }}{{ end -}}
{{- end -}}
{{- includeTemplate "toml-merge.tmpl" (dict "stdin" .chezmoi.stdin "managed" $managedConfig "defaults" dict) -}}
