# chezmoi:modify-template
{{- $managedConfig := fromToml `
# Docs: https://docs.x.ai/build/settings/reference
# mise owns the Grok version; grok update would bypass the lock.
[cli]
auto_update = false

[features]
feedback = false
# Python code intelligence uses the ty server declared in lsp.json.
lsp_tools = true
telemetry = false
# Web fetch is off by default; set here rather than GROK_WEB_FETCH so every launcher gets it.
web_fetch = true

[memory]
enabled = true

[ui]
compact_mode = true
follow_up_behavior = "steer"
permission_mode = "always-approve"
# vim_mode covers scrollback; simple_mode = false enables vim prompt editing.
simple_mode = false
# Grok uses its own built-in light palette.
theme = "grokday"
vim_mode = true

# Allow ordinary repository gates to finish; a command still running at the timeout moves
# to the background instead of being killed. 32 KiB (about 8k tokens) keeps failure output
# without letting one verbose command flood the context; write full logs to a file.
[toolset.bash]
auto_background_on_timeout = true
output_byte_limit = 32768
timeout_secs = 300.0

# Native symlinks supply the persona and skills. Foreign scanning duplicates
# instructions and can run another harness's session hooks with the wrong IDs.
[compat.claude]
agents = false
hooks = false
mcps = false
rules = false
skills = false

# Grok scans project .cursor directories by default, whether or not Cursor is installed.
[compat.cursor]
agents = false
hooks = false
mcps = false
rules = false
skills = false

` -}}
{{- /* default_reasoning_effort is a default rather than a managed key: it seeds a fresh
       config, then stays whatever the effort picker last persisted. */ -}}
{{- includeTemplate "config-merge.tmpl" (dict
      "stdin" .chezmoi.stdin
      "managed" $managedConfig
      "defaults" (dict "models" (dict "default_reasoning_effort" "high"))
      "format" "toml") -}}
