# chezmoi:modify-template
{{- $managedConfig := fromToml `
# Docs: https://docs.x.ai/build/settings/reference
[features]
feedback = false
# Python code intelligence uses the ty server declared in lsp.json.
lsp_tools = true
telemetry = false

[memory]
enabled = true

[models]
default_reasoning_effort = "xhigh"

[ui]
compact_mode = true
follow_up_behavior = "steer"
permission_mode = "always-approve"
# vim_mode covers scrollback; simple_mode = false enables vim prompt editing.
simple_mode = false
theme = "tokyonight"
vim_mode = true

# Allow ordinary repository gates to finish and retain useful failure output.
[toolset.bash]
output_byte_limit = 131072
timeout_secs = 300.0

[tools]
respect_gitignore = false

# GROK_WEB_FETCH enables fetching; retain its local-network boundary.
[toolset.web_fetch]
allow_local = false

# Native symlinks supply the persona and skills. Foreign scanning duplicates
# instructions and can run another harness's session hooks with the wrong IDs.
[compat.claude]
agents = false
hooks = false
mcps = false
rules = false
skills = false

[compat.cursor]
agents = false
hooks = false
mcps = false
rules = false
skills = false

` -}}
{{- /* Prune retired managed keys so existing installations return to native defaults.
       models.default is cleared to follow Grok's current default model. */ -}}
{{- includeTemplate "toml-merge.tmpl" (dict
      "stdin" .chezmoi.stdin
      "managed" $managedConfig
      "defaults" dict
      "prune" (list "models.default" "privacy" "ui.show_timeline" "ui.voice_stt_language" "ui.yolo"
        "cli.auto_update" "features.active_agent_messages" "features.codebase_indexing"
        "features.mcp_auto_restart" "features.mcp_liveness_watchers" "features.subagent_worktree_snapshot"
        "features.two_pass_compaction" "models.inference_idle_timeout_secs" "models.max_retries"
        "models.stream_tool_calls" "models.subagent_rate_limit_max_attempts" "ui.fork_secondary_model"
        "ui.max_thoughts_width" "ui.render_mermaid" "ui.screen_mode"
        "compat.claude.sessions" "compat.codex.sessions" "compat.cursor.sessions")) -}}
